  return `${esc(w.slice(0, -1).join(" "))} <em>${esc(w[w.length - 1])}</em>`; };

function renderClient() {
  const s = CL.s, wrap = $("#c-wrap"); if (!wrap) return;
  const heroes = heroList(); CL.hi = Math.min(CL.hi || 0, Math.max(0, heroes.length - 1));
  const kit = CL.prods.find(p => p.is_combo && p.is_featured) || CL.prods.find(p => p.is_combo);
  const seen = store.get("seenStories", []);
  const last = store.get("lastOrder"); const hasLast = last && Date.now() - last.t < 6 * 36e5;
  const cats = CL.cats.filter(c => CL.prods.some(p => p.category_id === c.id && avail(p)));
  if (!CL.cat || !cats.some(c => c.id === CL.cat)) CL.cat = cats[0]?.id || null;
  wrap.innerHTML = `
  <header class="c-top">
    <a class="brand" href="#" aria-label="${esc(s.store_name)}">${LOGO}<div><div class="brand-name">${esc(s.store_name)}</div><div class="brand-sub">Delivery de salgados</div></div></a>
    <nav class="topnav" aria-label="Menu">
      <a class="tn on" href="#"><span>${ICON.home}</span><span class="lab">Cardápio</span></a>
      ${hasLast ? `<button class="tn" id="c-track">${ICON.orders}<span class="lab">Meu pedido</span><span class="pill num">#${last.code}</span></button>` : ""}
      ${CL.install ? `<button class="tn" id="c-install">${ICON.bag}<span class="lab">Instalar app</span></button>` : ""}
      <button class="tn round" id="c-theme" aria-label="${isDark() ? "Usar modo claro" : "Usar modo escuro"}">${isDark() ? ICON.sun : ICON.moon}</button>
    </nav>
  </header>
  ${CL.stories.length ? `<section class="stories" aria-label="Novidades do dia">${CL.stories.map((st, i) => `
    <button class="story" data-story="${i}"><span class="story-ring ${seen.includes(st.id) ? "seen" : ""}">${st.media_type === "video" ? `<video src="${esc(st.image_url)}#t=0.5" muted playsinline preload="metadata"></video>` : `<img src="${esc(st.image_url)}" alt="">`}</span><span>${esc(st.caption || "Novidade")}</span></button>`).join("")}</section>` : ""}
  ${!s.is_open ? `<div class="closed-note">${esc(s.pause_message || "Estamos fechados no momento.")} Você pode olhar o cardápio à vontade.</div>` : ""}
  <section class="bento">
    <div class="b-hero" id="hero"></div>
    <div class="b-side">
      <div class="b-tile"><div class="tl-h ifood-h">${ICON.bolt}<span>Entrega em parceria com</span><img class="ifood-logo" src="${PHOTOS.ifood}" alt="iFood"></div>${s.delivery_enabled
        ? `<strong>a partir de <em class="num">${money(s.delivery_base_fee)}</em></strong><div class="sub">${ICON.clock}<span>Até ${Number(s.delivery_max_km)} km · ${Number(s.prep_minutes)}–${Number(s.prep_minutes) + 20} min</span></div>`
        : `<strong>Só retirada hoje</strong><div class="sub">${ICON.pin}<span>${esc(s.address || "")}</span></div>`}</div>
      ${kit ? `<button class="b-tile" data-scroll="${kit.category_id}"><div class="tl-h">${ICON.gift}<span>Para festa</span></div><strong>${splitTitle(kit.name).replace(/<\/?em>/g, "")}</strong>
          <div class="sub"><span class="num">${money(kit.price)} · ver combos e kits</span></div><span class="chev">${ICON.chev}</span></button>`
        : `<div class="b-tile"><div class="tl-h">${ICON.pin}<span>Retirada</span></div><strong>Pronto em ${Number(s.prep_minutes)} min</strong><div class="sub">${esc(s.address || "")}</div></div>`}
    </div>
  </section>
  <div class="m-info">
    <span>${ICON.bolt}<span class="mi-t">${s.delivery_enabled ? `Entrega desde <b class="num">${money(s.delivery_base_fee)}</b><span class="mi-x"> · ${Number(s.prep_minutes)}–${Number(s.prep_minutes) + 20} min</span>` : "Só retirada hoje"}</span></span>
    ${kit ? `<button data-scroll="${kit.category_id}">${ICON.gift}Kits festa</button>` : ""}
  </div>
  <div class="filters ${CL.q ? "s-open" : ""}">
    <button class="s-btn" id="c-sbtn" aria-label="Pesquisar">${ICON.search}</button>
    <nav class="cats" aria-label="Categorias">${cats.map(c => `<button data-cat="${c.id}" aria-pressed="${CL.cat === c.id && !CL.q}">${CAT_ICON(c.name)}${esc(c.name)}</button>`).join("")}</nav>
    <label class="search">${ICON.search}<span class="sr">Pesquisar</span><input id="c-q" type="search" placeholder="Pesquisar salgados…" value="${esc(CL.q || "")}" autocomplete="off"></label>
  </div>
  <div id="c-list" style="display:flex;flex-direction:column;gap:34px"></div>
  <footer class="c-foot"><span>${esc(s.store_name)} · ${esc(s.address || "")} · ${esc(s.opening_hours || "")}</span>${window.BS_APP === "client" ? "" : `<a href="#admin">Área do dono</a>`}</footer>`;
  renderHero(); renderClientList(); renderCartBar();
  $("#c-theme").onclick = () => { themeToggle(); renderClient(); };
  $("#c-install") && ($("#c-install").onclick = async () => { CL.install.prompt(); try { await CL.install.userChoice; } catch {} CL.install = null; renderClient(); });
  $("#c-track") && ($("#c-track").onclick = () => openTracking(last.id));
  $$("[data-story]", wrap).forEach(b => b.onclick = () => openStories(+b.dataset.story));
  $("#c-sbtn").onclick = () => { const f = $(".filters", wrap); f.classList.toggle("s-open"); if (f.classList.contains("s-open")) $("#c-q").focus(); else if (CL.q) { CL.q = ""; $("#c-q").value = ""; renderClientList(); } };
  $("#c-q").oninput = e => { CL.q = e.target.value; $$("[data-cat]", wrap).forEach(x => x.setAttribute("aria-pressed", !CL.q && x.dataset.cat === CL.cat)); renderClientList(); };
  $$("[data-cat],[data-scroll]", wrap).forEach(b => b.onclick = () => {
    const id = b.dataset.cat || b.dataset.scroll; CL.cat = id;
    if (CL.q) { CL.q = ""; $("#c-q").value = ""; renderClientList(); }
    $$("[data-cat]", wrap).forEach(x => x.setAttribute("aria-pressed", x.dataset.cat === id));
    document.getElementById("sec-" + id)?.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
  });
  clearInterval(CL.heroTimer);
  if (heroes.length > 1 && !matchMedia("(prefers-reduced-motion: reduce)").matches)
    CL.heroTimer = setInterval(() => { if (document.hidden || $(".overlay") || !$("#hero")) return; CL.hi = (CL.hi + 1) % heroList().length; renderHero(); }, 7000);
}

function renderHero() {
  const el = $("#hero"); if (!el) return;
  const heroes = heroList(); const p = heroes[CL.hi || 0];
  if (!p) { el.innerHTML = `<div class="glow"></div><div class="copy"><span class="badge">${ICON.trend}Cardápio do dia</span><h1>${splitTitle(CL.s.tagline || CL.s.store_name)}</h1></div>`; return; }
  const q = CL.cart[p.id] || 0;
  el.innerHTML = `<div class="glow"></div><div class="photo">${productThumb(p)}</div>
    <div class="copy"><span class="badge">${ICON.trend}${p.is_combo ? "Ideal para festas" : CL.hi === 0 ? "O mais pedido da casa" : "Saindo quentinho"}</span>
      <h1>${splitTitle(p.name)}</h1>${p.description ? `<p class="desc">${esc(p.description)}</p>` : ""}
      <div class="buy"><span class="price num">${money(p.price)}</span>
        ${q ? `<div class="stepper" style="height:54px"><button data-hd aria-label="Tirar um" style="width:50px;height:54px">−</button><span class="num">${q}</span><button data-hi aria-label="Pôr mais um" style="width:50px;height:54px">+</button></div>`
          : `<button class="btn-add" data-hadd ${!CL.s.is_open ? "disabled" : ""}>${ICON.plus}${CL.s.is_open ? "Adicionar" : "Loja fechada"}</button>`}</div></div>
    ${heroes.length > 1 ? `<div class="dots" role="tablist" aria-label="Destaques">${heroes.map((h, i) => `<button role="tab" aria-label="${esc(h.name)}" aria-current="${i === (CL.hi || 0)}" data-dot="${i}"></button>`).join("")}</div>` : ""}`;
  $("[data-hadd]", el) && ($("[data-hadd]", el).onclick = () => { setQty(p.id, 1); renderHero(); });
  $("[data-hi]", el) && ($("[data-hi]", el).onclick = () => { setQty(p.id, q + 1); renderHero(); });
  $("[data-hd]", el) && ($("[data-hd]", el).onclick = () => { setQty(p.id, q - 1); renderHero(); });
  $$("[data-dot]", el).forEach(b => b.onclick = () => { CL.hi = +b.dataset.dot; renderHero(); });
}

function renderClientList() {
  const el = $("#c-list"); if (!el) return;
  const q = (CL.q || "").trim().toLowerCase();
  const match = p => !q || p.name.toLowerCase().includes(q) || (p.description || "").toLowerCase().includes(q);
  const groups = CL.cats.map(c => ({ c, items: CL.prods.filter(p => p.category_id === c.id && avail(p) && match(p)) })).filter(g => g.items.length);
  const loose = CL.prods.filter(p => !CL.cats.some(c => c.id === p.category_id) && avail(p) && match(p));
  if (loose.length) groups.push({ c: { id: "outros", name: "Outros" }, items: loose });
  CL.open ||= {};
  if (!groups.length) { el.innerHTML = q ? `<div class="empty-search"><h3>Nada com “${esc(CL.q)}”</h3><p>Tente outro nome, como coxinha ou kibe.</p></div>`
    : `<div class="empty-search"><h3>Cardápio em preparo</h3><p>Os salgados aparecem aqui assim que a loja cadastrar.</p></div>`; return; }
  const LIMIT = 4;
  el.innerHTML = groups.map(({ c, items }) => { const all = q || CL.open[c.id] || items.length <= LIMIT; const shown = all ? items : items.slice(0, LIMIT);
    return `<section class="sec" id="sec-${c.id}"><div class="sec-h"><h2>${esc(c.name)}</h2>${items.length > LIMIT && !q
      ? `<button class="see-all" data-open="${c.id}">${CL.open[c.id] ? "Ver menos" : `Ver todos (${items.length})`}${ICON.arrow}</button>` : ""}</div>
    <div class="plist">${shown.map(productCard).join("")}</div></section>`; }).join("");
  $$("[data-inc]", el).forEach(b => b.onclick = () => setQty(b.dataset.inc, (CL.cart[b.dataset.inc] || 0) + 1));
  $$("[data-dec]", el).forEach(b => b.onclick = () => setQty(b.dataset.dec, (CL.cart[b.dataset.dec] || 0) - 1));
  $$("[data-open]", el).forEach(b => b.onclick = () => { CL.open[b.dataset.open] = !CL.open[b.dataset.open]; renderClientList(); });
}
function productCard(p) {
  const q = CL.cart[p.id] || 0, ok = avail(p), low = p.track_stock && p.stock > 0 && p.stock <= p.low_stock_alert;
  const tag = !ok ? `<span class="tag-chip bad">Esgotado</span>` : low ? `<span class="tag-chip warn">Restam ${p.stock}</span>` : p.is_featured ? `<span class="tag-chip">Destaque</span>` : "";
  return `<article class="pcard ${ok ? "" : "off"} ${tag ? "has-tag" : ""}">
    <div class="pimg">${productThumb(p)}</div>
    <div class="info"><h3>${esc(p.name)}</h3>
      ${p.description ? `<p class="desc">${esc(p.description)}</p>` : ""}
      ${p.is_combo && p.combo_items ? `<p class="incl">Inclui: ${esc(p.combo_items)}</p>` : ""}
      <div class="foot"><span class="price num">${money(p.price)} <span class="unit">/ ${esc(p.unit_label)}</span></span>
        ${!ok || !CL.s.is_open ? "" : q
          ? `<div class="stepper"><button data-dec="${p.id}" aria-label="Tirar um">−</button><span class="num">${q}</span><button data-inc="${p.id}" aria-label="Pôr mais um">+</button></div>`
          : `<button class="addbtn" data-inc="${p.id}" aria-label="Adicionar ${esc(p.name)}">${ICON.plus}</button>`}</div></div>
    ${tag ? `<div class="tag">${tag}</div>` : ""}
  </article>`;
}

function renderCartBar() {
  const bar = $("#cartbar"); if (!bar) return;
  const n = cartCount();
  bar.hidden = !n;
  if (!n) return;
  bar.innerHTML = `<button id="open-cart"><span><span class="count num">${n}</span>Ver sacola</span><span class="num">${money(cartSubtotal())}</span></button>`;
  $("#open-cart").onclick = openCart;
}

/* ---------- sacola e finalização ---------- */
function openCart() {
  const s = CL.s;
  const st = { mode: s.delivery_enabled ? (CL.me.mode || "entrega") : "retirada", pay: null };
  if (!s.pickup_enabled) st.mode = "entrega";
  const pays = [s.accept_pix && ["pix", "Pix", "Copia a chave depois do pedido"], s.accept_cash && ["dinheiro", "Dinheiro", "Informe se precisa de troco"],
    s.accept_card_on_delivery && ["cartao", "Cartão", "Crédito ou débito na maquininha"], s.mp_enabled && ["mercadopago", "Pagar online", "Mercado Pago"]].filter(Boolean);
  st.pay = CL.me.pay && pays.some(p => p[0] === CL.me.pay) ? CL.me.pay : pays[0]?.[0];
  const sh = openSheet(`<div class="sheet-head"><h2>Sua sacola</h2><button class="btn icon ghost" data-close aria-label="Fechar">✕</button></div>
    <div class="box" id="ck-items"></div>
    ${s.delivery_enabled && s.pickup_enabled ? `<div class="seg" role="group" aria-label="Como receber"><button data-mode="entrega">Entregar</button><button data-mode="retirada">Retirar na loja</button></div>` : ""}
    <div id="ck-addr"></div>
    <div class="box">
      <div class="grid2"><div class="field"><label for="ck-name">Seu nome</label><input class="input" id="ck-name" autocomplete="name" value="${esc(CL.me.name || "")}"></div>
      <div class="field"><label for="ck-phone">WhatsApp</label><input class="input" id="ck-phone" inputmode="tel" autocomplete="tel" placeholder="(00) 00000-0000" value="${esc(CL.me.phone || "")}"></div></div>
    </div>
    ${CL.me.name ? `<p class="saved-note">${ICON.check}<span>Seus dados ficam salvos neste celular para a próxima compra.</span><button id="ck-forget">Apagar meus dados</button></p>` : ""}
    <label class="optin"><input type="checkbox" id="ck-optin" ${CL.me.optin === false ? "" : "checked"}><span>Quero receber promoções e novidades da loja no WhatsApp</span></label>
    <div class="box"><span class="lbl">Pagamento</span><div id="ck-pay" style="display:flex;flex-direction:column;gap:8px"></div><div id="ck-change"></div></div>
    <div class="field"><label for="ck-notes">Observações</label><textarea class="input" id="ck-notes" placeholder="Ex.: sem cebola, tocar a campainha"></textarea></div>
    <div class="box" id="ck-sum"></div>
    <button class="btn primary block" id="ck-go" style="min-height:52px;font-size:1.02rem">Fazer pedido</button>`,
    { onClose: () => { bus.h.cart = (bus.h.cart || []).filter(f => f !== onCart); } });
  const el = sh.el;
  function onCart() { if (!cartCount()) { sh.close(); return; } drawItems(); drawSum(); }
  bus.on("cart", onCart);

  function drawItems() {
    $("#ck-items", el).innerHTML = cartLines().map(l => `<div class="line-item">${productThumb(l.p)}<div class="grow"><div style="font-weight:600">${esc(l.p.name)}</div><div class="faint num" style="font-size:.84rem">${money(l.p.price)} cada</div></div>
      <div class="stepper" style="height:34px"><button data-d="${l.p.id}" aria-label="Tirar um">−</button><span class="num">${l.qty}</span><button data-i="${l.p.id}" aria-label="Pôr mais um">+</button></div>
      <div class="num" style="font-weight:700;min-width:74px;text-align:right">${money(l.p.price * l.qty)}</div></div>`).join("");
    $$("[data-i]", el).forEach(b => b.onclick = () => setQty(b.dataset.i, CL.cart[b.dataset.i] + 1));
    $$("[data-d]", el).forEach(b => b.onclick = () => setQty(b.dataset.d, CL.cart[b.dataset.d] - 1));
  }
  function drawMode() {
    $$("[data-mode]", el).forEach(b => b.setAttribute("aria-pressed", b.dataset.mode === st.mode));
    const a = CL.addr;
    const saved = a.street && a.num && a.city && !st.editAddr;
    $("#ck-addr", el).innerHTML = st.mode === "retirada"
      ? `<div class="box"><div class="row" style="gap:10px">${ICON.pin}<div><div style="font-weight:600">Retire na loja</div><div class="muted" style="font-size:.88rem">${esc(s.address || "")}</div></div></div></div>`
      : saved ? `<div class="box"><div class="saved-addr">${ICON.pin}<div class="grow"><span class="lbl">Entregar em</span>
          <div style="font-weight:700">${esc(a.street)}, ${esc(a.num)}</div><div class="muted" style="font-size:.86rem">${esc([a.district, a.city + (a.uf ? "/" + a.uf : ""), a.ref].filter(Boolean).join(" · "))}</div></div>
          <button class="btn sm ghost" id="ad-edit">Trocar</button></div><div id="ad-quote"></div></div>`
      : `<div class="box"><span class="lbl">Endereço de entrega</span>
        <div class="grid2"><div class="field"><label for="ad-cep">CEP</label><input class="input" id="ad-cep" inputmode="numeric" autocomplete="postal-code" placeholder="00000-000" value="${esc(a.cep || "")}"></div>
        <div class="field"><label for="ad-num">Número</label><input class="input" id="ad-num" inputmode="numeric" value="${esc(a.num || "")}"></div></div>
        <div class="field"><label for="ad-street">Rua</label><input class="input" id="ad-street" autocomplete="address-line1" value="${esc(a.street || "")}"></div>
        <div class="grid2"><div class="field"><label for="ad-district">Bairro</label><input class="input" id="ad-district" value="${esc(a.district || "")}"></div>
        <div class="field"><label for="ad-city">Cidade</label><input class="input" id="ad-city" value="${esc(a.city ? a.city + (a.uf ? " / " + a.uf : "") : "")}"></div></div>
        <div class="field"><label for="ad-ref">Complemento ou referência</label><input class="input" id="ad-ref" value="${esc(a.ref || "")}" placeholder="Apto, bloco, portão…"></div>
        <button class="btn" id="ad-calc">Calcular frete</button>
        <div id="ad-quote"></div></div>`;
    if (st.mode === "entrega" && saved) {
      $("#ad-edit", el).onclick = () => { st.editAddr = true; CL.quote = null; drawMode(); $("#ad-cep", el)?.focus(); };
      drawQuote();
      if (!CL.quote || CL.quote.stale) autoQuote();
    } else if (st.mode === "entrega") {
      const cep = $("#ad-cep", el);
      cep.oninput = async () => { const d = onlyDigits(cep.value); cep.value = d.length > 5 ? d.slice(0, 5) + "-" + d.slice(5, 8) : d;
        if (d.length === 8) { try { const r = await lookupCep(d); $("#ad-street", el).value = r.logradouro || ""; $("#ad-district", el).value = r.bairro || "";
          $("#ad-city", el).value = r.localidade + " / " + r.uf; CL.addr.uf = r.uf; $("#ad-num", el).focus(); } catch (e) { toast("CEP não encontrado. Preencha a rua à mão.", true); } } };
      $("#ad-calc", el).onclick = e => busy(e.currentTarget, calcQuote);
      $("#ad-num", el).onchange = () => $("#ad-street", el).value && calcQuote().catch(err => toast(errMsg(err), true));
      ["ad-street", "ad-cep", "ad-district", "ad-city", "ad-num"].forEach(id => $("#" + id, el).addEventListener("input", () => { CL.quote = null; delete CL.addr.lat; drawQuote(); drawSum(); }));
      drawQuote();
    }
    drawSum();
  }
  async function autoQuote() {
    const a = CL.addr; const box = $("#ad-quote", el);
    try {
      if (a.lat != null && s.lat != null) { box && (box.innerHTML = `<div class="freight" style="background:var(--surface-2);color:var(--fg-2)">Calculando o frete…</div>`);
        const q = await API.quote(a.lat, a.lng, a.route_km, cartSubtotal());
        CL.quote = { ...q, lat: a.lat, lng: a.lng, route_km: a.route_km }; drawQuote(); drawSum(); }
      else await calcQuote();
    } catch (e) { toast(errMsg(e), true); }
  }
  function readAddr() {
    if (!$("#ad-cep", el)) return CL.addr;
    const [city, uf] = $("#ad-city", el).value.split("/").map(x => x.trim());
    CL.addr = { cep: $("#ad-cep", el).value, num: $("#ad-num", el).value.trim(), street: $("#ad-street", el).value.trim(), district: $("#ad-district", el).value.trim(),
      city: city || "", uf: uf || CL.addr.uf || "", ref: $("#ad-ref", el).value.trim() };
    store.set("addr", CL.addr); return CL.addr;
  }
  async function calcQuote() {
    const a = readAddr();
    if (!a.street || !a.num || !a.city) { toast("Preencha CEP, rua, número e cidade.", true); return; }
    if (s.lat == null) { CL.quote = { ok: false, reason: "LOJA_SEM_LOCALIZACAO" }; drawQuote(); drawSum(); return; }
    $("#ad-quote", el).innerHTML = `<div class="freight" style="background:var(--surface-2);color:var(--fg-2)">Calculando a distância…</div>`;
    const geo = await geocode({ street: a.street, number: a.num, city: a.city, uf: a.uf, cep: a.cep, district: a.district });
    const km = await routeKm({ lat: s.lat, lng: s.lng }, geo);
    const q = await API.quote(geo.lat, geo.lng, n2(km), cartSubtotal());
    CL.quote = { ...q, lat: geo.lat, lng: geo.lng, route_km: n2(km), simulated: geo.simulated };
    if (q.ok) { Object.assign(CL.addr, { lat: geo.lat, lng: geo.lng, route_km: n2(km) }); store.set("addr", CL.addr); }
    drawQuote(); drawSum();
  }
  function drawQuote() {
    const box = $("#ad-quote", el); if (!box) return; const q = CL.quote;
    if (!q) { box.innerHTML = ""; return; }
    box.innerHTML = q.ok
      ? `<div class="freight"><span>${ICON.pin} ${String(q.distance_km).replace(".", ",")} km${q.simulated ? " (simulado)" : ""}</span><span class="num">${q.fee === 0 ? "Frete grátis" : money(q.fee)}</span></div>`
      : `<div class="freight bad">${esc(errMsg(q.reason))}${q.max_km ? ` Limite: ${Number(q.max_km)} km.` : ""}</div>`;
  }
  function drawPay() {
    $("#ck-pay", el).innerHTML = pays.length ? pays.map(([k, t, d]) => `<label class="li click" style="border:1px solid ${st.pay === k ? "var(--accent)" : "var(--line)"};border-radius:12px;padding:10px 12px">
      <input type="radio" name="ck-pay" value="${k}" ${st.pay === k ? "checked" : ""} style="accent-color:var(--accent)"><div class="grow"><div class="t">${t}</div><div class="d">${d}</div></div></label>`).join("")
      : `<p class="muted">A loja ainda não configurou formas de pagamento.</p>`;
    $$("[name=ck-pay]", el).forEach(r => r.onchange = () => { st.pay = r.value; drawPay(); });

    pend.forEach((o, i) => { AD.seen.add(o.id); enqueueOrder(o.id, { sound: i === pend.length - 1 }); });
    if (!first && pend.length) { refreshNav(); if (["inicio", "pedidos"].includes(AD.view)) renderView(); } }).catch(() => {});
  checkNew(true);
  // reserva: se a conexão ao vivo cair, confere pedidos novos a cada 30 segundos
  clearInterval(AD.poll); AD.poll = setInterval(() => { if (AD.user) checkNew(false); }, 30000);
  if (!AD.live) {

    bus.on("orders", p => { if (!AD.user) return; const o = p?.new;
      if (p?.eventType === "INSERT" && o?.channel === "app" && o.status === "novo" && !AD.seen?.has(o.id)) { AD.seen?.add(o.id); AD.newIds.add(o.id); enqueueOrder(o.id); }
      if (p?.eventType === "UPDATE" && o?.mp_paid_at && o.payment_status === "pago" && Date.now() - new Date(o.mp_paid_at) < 120e3 && !(AD.mpOk ||= new Set()).has(o.id)) {
        AD.mpOk.add(o.id); toast(`Pagamento online confirmado · pedido #${o.code} (${money(o.total)})`); }
      refreshNav(); if (["inicio", "pedidos", "vendas"].includes(AD.view)) renderView(); });
    bus.on("cash", () => AD.user && AD.view === "caixa" && renderView());

    bus.on("theme", () => AD.user && ["inicio", "relatorios"].includes(AD.view) && renderView());
  }
}
let audioCtx;

  g.gain.setValueAtTime(.15, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(.001, audioCtx.currentTime + .4); o.start(); o.stop(audioCtx.currentTime + .4); } catch {} }

/* ---------- gráficos ---------- */
function lineChart(canvas, labels, data) {
  if (!window.Chart) { canvas.parentElement.innerHTML = `<p class="muted">Gráfico indisponível sem conexão.</p>`; return; }
  const acc = cssVar("--accent"), fg2 = cssVar("--fg-2"), line = cssVar("--line"), ctx = canvas.getContext("2d");
  const g = ctx.createLinearGradient(0, 0, 0, canvas.parentElement.clientHeight || 260); g.addColorStop(0, color_mix(acc, .32)); g.addColorStop(1, color_mix(acc, 0));
  const c = new Chart(canvas, { type: "line", data: { labels, datasets: [{ data, borderColor: acc, backgroundColor: g, fill: true, tension: .35, borderWidth: 2.5,
      pointRadius: data.length > 31 ? 0 : 4, pointHoverRadius: 6, pointBackgroundColor: acc, pointBorderColor: cssVar("--surface"), pointBorderWidth: 2 }] },
    options: { responsive: true, maintainAspectRatio: false, animation: { duration: 300 }, interaction: { mode: "index", intersect: false },
      plugins: { legend: { display: false }, tooltip: { backgroundColor: cssVar("--fg"), titleColor: cssVar("--bg"), bodyColor: cssVar("--bg"), displayColors: false, padding: 10, callbacks: { label: x => money(x.raw) } } },
      scales: { x: { grid: { display: false }, border: { color: line }, ticks: { color: fg2, maxRotation: 0, autoSkip: true, autoSkipPadding: 14, font: { size: 12 } } },
        y: { beginAtZero: true, grid: { color: line }, border: { display: false }, ticks: { color: fg2, padding: 8, maxTicksLimit: 5, font: { size: 12 }, callback: v => v >= 1000 ? (v / 1000).toLocaleString("pt-BR") + "k" : v } } } } });
  AD.charts.push(c); return c;
}

    (S.length ? S.map(([k, l, ic, list, cls]) => `<section class="await ${cls}"><div class="card-h"><h3>${ic}${l}</h3><span class="faint">${list.length} pedido${list.length > 1 ? "s" : ""}</span></div>
      <div class="await-grid">${list.map(card).join("")}</div></section>`).join("")
      : `<div class="card empty-row" style="padding:60px 20px"><h3>Nenhum pedido no momento</h3><p>Quando um cliente pedir pelo app, o pedido aparece aqui e o painel toca o aviso.</p></div>`);

/* quantidade vendida no período do caixa (por categoria e por produto) */
async function soldQty(from, to) {
  const [orders, prods, cats] = await Promise.all([API.orders({ from: new Date(from), to: to ? new Date(new Date(to).getTime() + 1000) : undefined }), API.products(), API.categories()]);
  const catOf = id => cats.find(c => c.id === prods.find(p => p.id === id)?.category_id)?.name || "Outros";
  const ok = orders.filter(validOrder), byProd = new Map(), byCat = new Map();
  ok.forEach(o => (o.order_items || []).forEach(i => { const k = i.name, c = catOf(i.product_id);
    const r = byProd.get(k) || { name: k, cat: c, qty: 0, total: 0 }; r.qty += i.qty; r.total += Number(i.total); byProd.set(k, r);
    byCat.set(c, (byCat.get(c) || 0) + i.qty); }));
  const prodList = [...byProd.values()].sort((a, b) => b.qty - a.qty);
  const total = sumBy(prodList, r => r.qty), drinks = sumBy(prodList.filter(r => /bebida/i.test(r.cat)), r => r.qty);
  return { total, salgados: total - drinks, drinks, byCat: [...byCat.entries()].sort((a, b) => b[1] - a[1]), prodList,
    pendentes: ok.filter(o => o.payment_status === "pendente").length, pedidos: ok.length };
}

function barChart(canvas, labels, data, { money: isMoney = true, highlightLast = true } = {}) {
  if (!window.Chart) { canvas.parentElement.innerHTML = `<p class="muted">Gráfico indisponível sem conexão.</p>`; return; }
  const acc = cssVar("--accent"), soft = cssVar("--accent-soft"), fg2 = cssVar("--fg-2"), line = cssVar("--line");
  const c = new Chart(canvas, { type: "bar", data: { labels, datasets: [{ data, backgroundColor: data.map((_, i) => highlightLast && i === data.length - 1 ? acc : color_mix(acc, .55)),
      hoverBackgroundColor: acc, borderRadius: 4, borderSkipped: "bottom", maxBarThickness: 34, categoryPercentage: .8, barPercentage: .9 }] },
    options: { responsive: true, maintainAspectRatio: false, animation: { duration: 250 },
      plugins: { legend: { display: false }, tooltip: { backgroundColor: cssVar("--fg"), titleColor: cssVar("--bg"), bodyColor: cssVar("--bg"), displayColors: false, padding: 10,
        callbacks: { label: x => isMoney ? money(x.raw) : `${x.raw}` } } },
      scales: { x: { grid: { display: false }, ticks: { color: fg2, maxRotation: 0, autoSkip: true, autoSkipPadding: 8, font: { size: 11 } }, border: { color: line } },
        y: { beginAtZero: true, grid: { color: line, drawTicks: false }, border: { display: false }, ticks: { color: fg2, padding: 8, font: { size: 11 }, maxTicksLimit: 5,
          callback: v => isMoney ? (v >= 1000 ? "R$ " + (v / 1000).toLocaleString("pt-BR") + " mil" : "R$ " + v) : v } } } } });
  AD.charts.push(c); return c;
}
function color_mix(hex, a) { const m = hex.replace("#", ""); if (m.length !== 6) return hex; const n = parseInt(m, 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; }
const barList = (rows, fmt = money) => { const max = Math.max(1, ...rows.map(r => r[1]));
  return rows.length ? `<div class="bar-list">${rows.map(([n, v, extra]) => `<div class="bar-row"><span class="nm" title="${esc(n)}">${esc(n)}</span><span class="track"><span class="fill" style="width:${(v / max * 100).toFixed(1)}%"></span></span><span class="num" style="font-weight:600">${fmt(v)}${extra ? `<span class="faint" style="font-weight:400"> · ${extra}</span>` : ""}</span></div>`).join("")}</div>`
    : `<p class="muted">Sem dados no período.</p>`; };

function shrinkImage(file, max) {
  return new Promise(res => { const im = new Image(); const url = URL.createObjectURL(file);
    im.onload = () => { const k = Math.min(1, max / Math.max(im.width, im.height)); if (k === 1 && file.size < 400e3) { res(file); return; }
      const c = document.createElement("canvas"); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k); c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
      c.toBlob(b => res(new File([b], file.name.replace(/\.\w+$/, "") + ".jpg", { type: "image/jpeg" })), "image/jpeg", .85); URL.revokeObjectURL(url); };
    im.onerror = () => res(file); im.src = url; });
}

const SOUNDS = {
  caixa: ["Caixa registradora (cifrão)", (ctx, t, v) => {

    [[2093, 0.05], [2637, 0.12], [3136, 0.12]].forEach(([f, d], i) => bell(ctx, f, t + .06 + i * .07, .9, v * .5));
  }],
  moedas: ["Moedas", (ctx, t, v) => { for (let i = 0; i < 7; i++) bell(ctx, 2400 + Math.random() * 1800, t + i * .06 + Math.random() * .03, .25, v * .35); }],
  campainha: ["Campainha (ding-dong)", (ctx, t, v) => { bell(ctx, 784, t, 1.2, v * .55); bell(ctx, 622, t + .45, 1.4, v * .55); }],
  sino: ["Sino", (ctx, t, v) => { bell(ctx, 1046, t, 1.8, v * .6); bell(ctx, 1568, t, 1.2, v * .25); }],
  bipe: ["Bipe duplo", (ctx, t, v) => { tone(ctx, 1000, t, .12, v * .35, "square"); tone(ctx, 1000, t + .2, .12, v * .35, "square"); }],

let actx;
const audio = () => { try { actx ||= new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === "suspended") actx.resume(); return actx; } catch { return null; } };
document.addEventListener("pointerdown", () => audio(), { once: true });
function tone(ctx, f, t, d, v, type = "sine") { const o = ctx.createOscillator(), g = ctx.createGain(); o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + d); o.connect(g).connect(ctx.destination); o.start(t); o.stop(t + d + .05); }
function bell(ctx, f, t, d, v) { [1, 2.76, 5.4].forEach((m, i) => tone(ctx, f * m, t, d / (i + 1), v / (i * 2 + 1))); }
function noise(ctx, t, d, v, hp) { const b = ctx.createBuffer(1, ctx.sampleRate * d, ctx.sampleRate), data = b.getChannelData(0); for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
  const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain(); f.type = "highpass"; f.frequency.value = hp; s.buffer = b; g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  s.connect(f).connect(g).connect(ctx.destination); s.start(t); }

function printReceipt(o, { silentFail } = {}) {

}

/* ======================= ANIMAÇÃO DE APROXIMAÇÃO (efeito dock) ======================= */
/* Mesmo princípio da Floating Dock: cada item mede a distância do mouse ao próprio centro;
   até 150 px ele cresce, o mais perto cresce mais, e o tamanho segue uma mola (massa 0,1, rigidez 150, amortecimento 12). */
const MAG = { items: [], raf: 0, x: -1e4, y: -1e4, on: false };
function magSpring(it, target, dt) { const k = 150, c = 12, m = .1; const f = -k * (it.v - target) - c * it.vel; it.vel += f / m * dt; it.v += it.vel * dt; }
function magTick(t) {
  const dt = Math.min(.032, (t - (MAG.last || t)) / 1000) || .016; MAG.last = t; let moving = false;
  for (const it of MAG.items) {
    if (!it.el.isConnected) continue;
    const r = it.el.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    const d = it.axis === "y" ? Math.abs(MAG.y - cy) + (MAG.x < r.left - 40 || MAG.x > r.right + 40 ? 1e4 : 0) : Math.hypot(MAG.x - cx, MAG.y - cy);
    const p = Math.max(0, 1 - d / it.range), target = p * p * (3 - 2 * p);
    // passo fixo pequeno para a mola ficar estável
    for (let s = 0; s < 4; s++) magSpring(it, target, dt / 4);
    if (Math.abs(it.v - target) > .001 || Math.abs(it.vel) > .001) moving = true;
    it.apply(Math.max(0, it.v));
  }
  MAG.raf = moving || MAG.on ? requestAnimationFrame(magTick) : 0;
}
function magnify(root) {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches || !matchMedia("(hover: hover) and (pointer: fine)").matches) return;
  MAG.items = MAG.items.filter(i => i.el.isConnected);
  const add = (el, axis, range, apply) => { if (el._mag) return; el._mag = 1; MAG.items.push({ el, axis, range, apply, v: 0, vel: 0 }); };
  $$(".qa, .stat, .cx-act, .pc, .sale-cta, .sale-today, .method, .kpi", root).forEach(el => { el.classList.add("mag");
    add(el, "xy", 220, v => { el.style.transform = v > .002 ? `translateY(${(-v * 4).toFixed(2)}px) scale(${(1 + v * .035).toFixed(4)})` : ""; el.style.zIndex = v > .3 ? 2 : ""; }); });
  if (!MAG.bound) { MAG.bound = true;
    document.addEventListener("pointermove", e => { if (e.pointerType === "touch") return; MAG.x = e.clientX; MAG.y = e.clientY; MAG.on = true; if (!MAG.raf) MAG.raf = requestAnimationFrame(magTick); }, { passive: true });
    document.addEventListener("pointerleave", () => { MAG.x = MAG.y = -1e4; MAG.on = false; });
    document.documentElement.addEventListener("mouseleave", () => { MAG.x = MAG.y = -1e4; MAG.on = false; if (!MAG.raf) MAG.raf = requestAnimationFrame(magTick); });
  }
}

const firstName = n => { const w = String(n || "").trim().split(/\s+/); return /^(seu|sr\.?|dona|d\.|dr\.?|dra\.?)$/i.test(w[0]) && w[1] ? w[0] + " " + w[1] : w[0]; };
const fillMsg = (tpl, v) => String(tpl || "").replace(/\{(\w+)\}/g, (m, k) => v[k] ?? m);

/* junta clientes cadastrados e quem comprou pelo app (um contato por telefone) */
async function loadContacts() {
  const [custs, orders] = await Promise.all([API.customers(), API.orders({ from: new Date(Date.now() - 365 * 864e5) })]);
  const map = new Map();
  for (const c of custs) { const k = phoneKey(c.phone); if (k.length < 8) continue;
    map.set(k, { key: k, name: c.name, phone: c.phone, customer_id: c.id, balance: Number(c.balance) || 0, optin: !!c.whatsapp_optin, source: "Cliente cadastrado", last: c.last_movement }); }
  for (const o of orders) { const k = phoneKey(o.customer_phone); if (k.length < 8 || !validOrder(o)) continue;
    const cur = map.get(k);
    if (cur) { cur.optin = cur.optin || !!o.marketing_optin; if (!cur.last || o.created_at > cur.last) cur.last = o.created_at; cur.orders = (cur.orders || 0) + 1; }
    else map.set(k, { key: k, name: o.customer_name, phone: o.customer_phone, customer_id: null, balance: 0, optin: !!o.marketing_optin, source: "Comprou pelo app", last: o.created_at, orders: 1 }); }
  return [...map.values()].sort((a, b) => a.name.localeCompare(b.name));
}

function recipientPicker(list, { preselect, badge }) {
  const sel = new Set(list.filter(preselect).map(c => c.key));
  const wrap = h(`<div class="card tight rp"><div class="card-h"><h3>${ICON.users}Para quem</h3>
      <div class="tools"><label class="search-box">${ICON.search}<input placeholder="Buscar nome ou telefone" aria-label="Buscar contato"></label>
      <button class="btn sm ghost" data-all>Selecionar todos</button><button class="btn sm ghost" data-none>Limpar</button></div></div>
    <div class="rp-count"></div><div class="rp-list"></div></div>`);
  let q = "";
  const draw = () => { const t = q.toLowerCase(), d = onlyDigits(q);
    const vis = list.filter(c => !t || c.name.toLowerCase().includes(t) || (d.length > 2 && onlyDigits(c.phone).includes(d)));
    $(".rp-list", wrap).innerHTML = vis.length ? vis.map(c => `<label class="rp-row"><input type="checkbox" data-k="${c.key}" ${sel.has(c.key) ? "checked" : ""}>
      <span class="who"><i>${initials(c.name)}</i><span><b>${esc(c.name)}</b><span class="faint">${esc(c.phone)} · ${esc(c.source)}</span></span></span>${badge(c)}</label>`).join("")
      : `<p class="empty-row">Nenhum contato com telefone. Os clientes aparecem aqui quando compram pelo app ou quando você cadastra o telefone deles.</p>`;
    $(".rp-count", wrap).innerHTML = `<b class="num">${sel.size}</b> de ${list.length} selecionado${sel.size === 1 ? "" : "s"}`;
    $$("[data-k]", wrap).forEach(i => i.onchange = () => { i.checked ? sel.add(i.dataset.k) : sel.delete(i.dataset.k); $(".rp-count", wrap).innerHTML = `<b class="num">${sel.size}</b> de ${list.length} selecionado${sel.size === 1 ? "" : "s"}`; wrap.dispatchEvent(new Event("change")); }); };
  $("input", wrap).oninput = e => { q = e.target.value; draw(); };
  $("[data-all]", wrap).onclick = () => { list.forEach(c => sel.add(c.key)); draw(); wrap.dispatchEvent(new Event("change")); };
  $("[data-none]", wrap).onclick = () => { sel.clear(); draw(); wrap.dispatchEvent(new Event("change")); };
  draw();
  wrap.selected = () => list.filter(c => sel.has(c.key));
  return wrap;
}

}

function drawDebts(body, contacts, s) {
  const debtors = contacts.filter(c => c.balance > 0.009).sort((a, b) => b.balance - a.balance);
  const build = c => fillMsg(s.wa_debt_text, { nome: firstName(c.name), loja: s.store_name || "Bruno Salgados", valor: money(c.balance), pix: s.pix_key || "(chave Pix)", link: appLink() });
  body.innerHTML = `<div class="mg-grid"><div class="card"><div class="card-h"><h3>${ICON.receipt}Cobrança</h3><span class="pay pendente num">${money(sumBy(debtors, c => c.balance))} em aberto</span></div>
      <p class="muted" style="font-size:.9rem">Só aparecem os clientes com fiado em aberto. Cada um recebe a mensagem com o próprio saldo.</p>
      <div class="field"><label>Prévia</label><div class="wa-bubble" id="db-prev"></div></div>
      <p class="faint" style="font-size:.82rem">Edite o texto em Configurações › WhatsApp. Use {nome}, {valor}, {pix} e {loja}.</p></div>
    <div id="db-rp"></div></div>
    <div class="mg-send"><span id="db-sum" class="muted"></span><button class="btn primary big-btn" id="db-go">${ICON.wa}Enviar cobranças</button></div>`;
  const rp = recipientPicker(debtors, { preselect: () => true, badge: c => `<span class="pay pendente num">${money(c.balance)}</span>` });
  $("#db-rp", body).appendChild(rp);
  const prev = () => { const first = rp.selected()[0] || debtors[0] || { name: "Maria", balance: 25 };
    $("#db-prev", body).innerHTML = `<span>${esc(build(first)).replace(/\n/g, "<br>")}</span>`;
    const l = rp.selected(); $("#db-sum", body).textContent = `${l.length} cliente${l.length === 1 ? "" : "s"} · ${money(sumBy(l, c => c.balance))}`; };
  rp.addEventListener("change", prev); prev();
  $("#db-go", body).onclick = e => busy(e.currentTarget, async () => {
    const list = rp.selected(); if (!list.length) { toast("Escolha pelo menos um cliente.", true); return; }
    if (s.wa_mode === "api") return sendApi(list, { kind: "cobranca", template: s.wa_debt_template, params: c => [firstName(c.name), money(c.balance), s.pix_key || ""] });
    sendManual(list.map(c => ({ ...c, text: build(c) })), { kind: "cobranca" });
  });
}

/* envio automático pela API oficial */
async function sendApi(list, { kind, template, image_url, params }) {
  if (!template) throw new Error("MODELO_OBRIGATORIO");
  const r = await API.waSend({ kind, template, image_url, recipients: list.map(c => ({ phone: c.phone, name: c.name, params: params(c) })) });
  openSheet(`<div class="sheet-head"><h2>Envio concluído</h2><button class="btn icon ghost" data-close aria-label="Fechar">✕</button></div>
    <div class="mini-stats"><div><span>Enviadas</span><b class="num" style="color:var(--good)">${r.sent}</b></div><div><span>Com erro</span><b class="num" style="color:${r.failed ? "var(--bad)" : "inherit"}">${r.failed}</b></div></div>
    ${r.failed ? `<div class="tl">${r.results.filter(x => !x.ok).map(x => `<div class="tl-i"><span class="h">${esc(x.phone)}</span><span class="faint">${esc(x.error || "")}</span><span></span></div>`).join("")}</div>` : ""}`);
}

/* envio pelo WhatsApp do dono: um por um, com o texto pronto */
function sendManual(list, { kind, imageFile, imageUrl }) {
  let i = 0; const sent = [];
  const canShare = imageFile && navigator.canShare?.({ files: [imageFile] });
  const sh = openSheet(`<div class="sheet-head"><div><h2>Enviando pelo WhatsApp</h2><p class="faint" id="sm-step" style="margin-top:2px"></p></div><button class="btn icon ghost" data-close aria-label="Fechar">✕</button></div>
    <div class="wa-prog"><i id="wa-bar"></i></div><div id="wa-cur"></div>`, { onClose: () => { if (sent.length) { API.logMessages(sent).catch(() => {}); toast(`${sent.length} mensage${sent.length === 1 ? "m" : "ns"} enviada${sent.length === 1 ? "" : "s"}`); if (AD.view === "mensagens") renderView(); } } });
  const draw = () => {
    $("#wa-bar", sh.el).style.width = (i / list.length * 100) + "%";
    if (i >= list.length) { $("#sm-step", sh.el).textContent = "Pronto";
      $("#wa-cur", sh.el).innerHTML = `<div class="inc-done">${ICON.checkBig}<h3>${sent.length} de ${list.length} enviadas</h3><button class="btn primary" data-close>Concluir</button></div>`;
      $$("[data-close]", sh.el).forEach(b => b.onclick = () => sh.close()); return; }
    const c = list[i];
    $("#sm-step", sh.el).textContent = `${i + 1} de ${list.length}`;
    $("#wa-cur", sh.el).innerHTML = `<div class="inc-cust"><div class="who"><i>${initials(c.name)}</i><div><b>${esc(c.name)}</b><span class="faint" style="font-size:.86rem">${esc(c.phone)}</span></div></div>${c.balance > 0 && kind === "cobranca" ? `<span class="pay pendente num">${money(c.balance)}</span>` : ""}</div>
      <div class="wa-bubble">${imageUrl ? `<img src="${esc(imageUrl)}" alt="">` : ""}<span>${esc(c.text).replace(/\n/g, "<br>")}</span></div>
      ${imageUrl ? `<p class="faint" style="font-size:.84rem">${canShare ? "Toque em Mandar com imagem para escolher a conversa no WhatsApp." : "O link do WhatsApp leva só o texto. Para mandar a foto, anexe no próprio WhatsApp ou envie pelo celular, que tem a opção de compartilhar a imagem."}</p>` : ""}
      <div class="inc-act"><button class="btn ghost" id="wa-skip">Pular</button>
        <a class="btn primary big-btn" id="wa-open" href="${waLink(c.phone, c.text)}" target="_blank" rel="noopener">${ICON.wa}Abrir no WhatsApp</a></div>
      ${canShare ? `<button class="btn ghost block" id="wa-share">Mandar com imagem (compartilhar)</button>` : ""}`;
    const next = ok => { if (ok) sent.push({ kind, channel: "manual", phone: c.phone, name: c.name, body: c.text }); i++; draw(); };
    $("#wa-open", sh.el).onclick = () => setTimeout(() => next(true), 300);
    $("#wa-skip", sh.el).onclick = () => next(false);
    $("#wa-share", sh.el) && ($("#wa-share", sh.el).onclick = async () => { try { await copyText(c.text); await navigator.share({ files: [imageFile], text: c.text }); next(true); } catch {} });
  };
  draw();
}

async function drawHistory(body) {
  const log = await API.messageLog();
  const K = { promo: "Promoção", cobranca: "Cobrança", story: "Story" };
  body.innerHTML = `<div class="card tight"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Quando</th><th>Tipo</th><th>Contato</th><th class="hide-sm">Mensagem</th><th>Como</th></tr></thead><tbody>
    ${log.length ? log.map(m => `<tr><td class="faint num">${fmtDT(m.created_at)}</td><td>${K[m.kind]}</td><td><b>${esc(m.name || "")}</b><div class="sub">${esc(m.phone)}</div></td><td class="hide-sm clip">${esc(m.body || "")}</td>
      <td>${m.status === "erro" ? `<span class="pay pendente" title="${esc(m.error || "")}">Erro</span>` : `<span class="pay pago">${m.channel === "api" ? "Automático" : "Pelo WhatsApp"}</span>`}</td></tr>`).join("")
      : `<tr><td colspan="5" class="empty-row">Nenhuma mensagem enviada ainda.</td></tr>`}</tbody></table></div></div>`;
}

/* ================= roteamento ================= */
async function route() {
  const isAdmin = window.BS_APP === "admin" || (window.BS_APP !== "client" && location.hash.startsWith("#admin"));
  if (isAdmin) await startAdmin(); else await startClient();
}
const CLIENT_URL = () => window.BS_APP === "admin" ? location.origin + "/" : location.href.split("#")[0];
(async function boot() {
  try { await initApi(); } catch { return; }
  if (API.mode === "demo" && !window.BS_APP) {
    const bar = $("#demo-bar"); bar.hidden = false;
    const small = matchMedia("(max-width:600px)").matches;
    bar.innerHTML = `<span>${small ? "Apresentação · dados de exemplo" : "Versão de apresentação com dados de exemplo"}</span>
      <span class="demo-sw"><a href="#" data-sw="c">Cliente</a><a href="#admin" data-sw="a">Dono</a></span>`;
    const mark = () => $$("[data-sw]", bar).forEach(x => x.setAttribute("aria-current", (x.dataset.sw === "a") === location.hash.startsWith("#admin") ? "page" : "false"));
    mark(); window.addEventListener("hashchange", mark);
    $('[data-sw="a"]', bar).onclick = async e => { e.preventDefault(); if (!(await API.getUser())) await API.signIn(); location.hash = "#admin"; };
  }
  let last = location.hash.startsWith("#admin");
  window.addEventListener("hashchange", () => { const now = location.hash.startsWith("#admin"); if (now !== last) { last = now; route(); } });
  route();
})();

</script>

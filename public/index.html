<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#100D0B">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Bruno Salgados">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><link rel="icon" href="icon-192.png">
<meta property="og:title" content="Bruno Salgados"><meta property="og:description" content="Peça salgados fresquinhos para entrega ou retirada.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Bruno Salgados</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Peça salgados fresquinhos da Bruno Salgados para entrega ou retirada.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>/* Layout: vitrine escura premium; hero assimétrico com foto + dois cards laterais; grade de cards horizontais.
   Escuro é o padrão da marca; o claro é a mesma vitrine em tons de massa crua. */
:root{
  --bg:#100D0B; --surface:#211812; --surface-2:#2B2019; --line:#382A20; --line-2:#4A372A;
  --fg:#F7EFE6; --fg-2:#B9A797; --fg-3:#8C7A6B;
  --accent:#FF941F; --accent-strong:#FFA640; --accent-soft:#3A2512; --on-accent:#1B0F05; --accent-text:#FF9E33;
  --good:#6CC08A; --good-soft:#1B3123; --warn:#F2B84B; --warn-soft:#3A2D12;
  --bad:#F27D63; --bad-soft:#3D1D16; --info:#7CC0E0; --info-soft:#14303D;
  --hero-bg:#1A120D; --hero-fg:#F7EFE6; --hero-fg-2:#C9B8A8;
  --glow:rgba(255,148,31,.30); --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 10px 30px rgba(0,0,0,.35);
  --f-display:"Manrope","Segoe UI",system-ui,sans-serif;
  --f-body:"Manrope","Segoe UI",system-ui,-apple-system,sans-serif;
  --r-lg:22px; --r-md:16px; --r-sm:12px;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#FAF5EF; --surface:#FFFFFF; --surface-2:#F4ECE2; --line:#EADFD2; --line-2:#DCCBB8;
  --fg:#1F150E; --fg-2:#6A5848; --fg-3:#9A8777;
  --accent:#FF8A0F; --accent-strong:#E8780A; --accent-soft:#FFEBD5; --on-accent:#1B0F05; --accent-text:#C2620A;
  --good:#2F7A4A; --good-soft:#E2F1E6; --warn:#A86F08; --warn-soft:#FBF0D6;
  --bad:#B83A24; --bad-soft:#F8E1DB; --info:#2D6A8A; --info-soft:#DDEEF5;
  --hero-bg:#1E1510; --hero-fg:#FBF4EC; --hero-fg-2:#D3C2B2;
  --glow:rgba(255,138,15,.32); --shadow:0 1px 2px rgba(60,35,15,.05),0 10px 28px rgba(60,35,15,.08);
  color-scheme:light;
}

*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);line-height:1.1;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.75rem;font-weight:700} h2{font-size:1.25rem;font-weight:700} h3{font-size:1.02rem;font-weight:650}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--fg-2)} .faint{color:var(--fg-3)}
.eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3);font-weight:600}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent-strong)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- botões e campos ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:999px;
  padding:10px 18px;font-weight:600;cursor:pointer;background:var(--surface-2);color:var(--fg);transition:transform .12s,background .15s;min-height:42px;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.primary:hover:not(:disabled){background:var(--accent-strong)}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.good{background:var(--good-soft);color:var(--good)}
.btn.sm{padding:6px 12px;min-height:34px;font-size:.88rem}
.btn.block{width:100%}
.btn.icon{padding:0;width:40px;min-height:40px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.lbl{font-size:.82rem;font-weight:600;color:var(--fg-2)}
.input,select.input,textarea.input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:11px 12px;min-height:44px;outline:none}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.input{min-height:72px;resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.seg{display:flex;background:var(--surface-2);border-radius:999px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;border-radius:999px;padding:8px 12px;font-weight:600;cursor:pointer;color:var(--fg-2);min-height:38px}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-text);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 40%,transparent)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;cursor:pointer}
.switch input{appearance:none;width:44px;height:26px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;flex:none;transition:background .15s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{transform:translateX(18px)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:.78rem;font-weight:600;background:var(--surface-2);color:var(--fg-2)}
.chip.good{background:var(--good-soft);color:var(--good)} .chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.info{background:var(--info-soft);color:var(--info)}
.chip.accent{background:var(--accent-soft);color:var(--accent-strong)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px}
.stepper{display:inline-flex;align-items:center;background:var(--accent);color:var(--on-accent);border-radius:999px;height:38px}
.stepper button{border:0;background:transparent;color:inherit;width:38px;height:38px;font-size:1.2rem;font-weight:700;cursor:pointer;border-radius:999px}
.stepper span{min-width:22px;text-align:center;font-weight:700}
.empty{padding:28px 16px;text-align:center;color:var(--fg-2);display:flex;flex-direction:column;gap:6px;align-items:center}
.svg-i{width:20px;height:20px;flex:none}

/* ---------- banner modo demonstração ---------- */
.demo-bar{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;background:var(--surface-2);color:var(--fg-2);border-bottom:1px solid var(--line);font-size:.82rem;font-weight:600;text-align:center;
  padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- toasts e folhas ---------- */
#toasts{position:fixed;left:0;right:0;top:calc(12px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;align-items:center;gap:8px;z-index:90;pointer-events:none;padding:0 16px}
.toast{background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:.9rem;box-shadow:var(--shadow);max-width:440px;animation:tin .25s ease}
.toast.bad{background:var(--bad);color:#fff}
@keyframes tin{from{transform:translateY(-8px);opacity:0}}
.overlay{position:fixed;inset:0;background:rgba(20,12,6,.45);z-index:60;display:flex;align-items:flex-end;justify-content:center;animation:fin .2s}
@keyframes fin{from{opacity:0}}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;
  padding:20px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));
  animation:sup .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;gap:16px}
@keyframes sup{from{transform:translateY(40px);opacity:.4}}
@media(min-width:720px){.overlay{align-items:center}.sheet{border-radius:24px;max-height:88vh}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}


.demo-sw{display:inline-flex;background:var(--bg);border:1px solid var(--line-2);border-radius:999px;padding:3px;gap:2px}
.demo-sw a{text-decoration:none;color:var(--fg-2);font-weight:700;padding:4px 14px;border-radius:999px;font-size:.8rem}
.demo-sw a[aria-current="page"]{background:linear-gradient(180deg,#FFA53A,var(--accent));color:var(--on-accent)}
/* listas compartilhadas */
a.btn{text-decoration:none}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line);min-width:0}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .d{font-size:.82rem;color:var(--fg-2)}
.li.click{cursor:pointer;border-radius:10px}
.li.click:hover{background:var(--surface-2)}
/* =================== CLIENTE =================== */
.c-wrap{max-width:1140px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px 120px;display:flex;flex-direction:column;gap:26px}
@media(min-width:900px){.c-wrap{padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));gap:30px}}

/* topo */
.c-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:12px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit}
.logo{width:46px;height:46px;flex:none;display:block}
.brand-name{font-family:var(--f-display);font-weight:800;font-size:1.32rem;letter-spacing:-.025em;line-height:1}
.brand-sub{font-size:.82rem;color:var(--accent-text);font-weight:600;margin-top:3px}
.topnav{display:flex;align-items:center;gap:6px}
.tn{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 16px;border-radius:999px;border:1px solid transparent;background:transparent;color:var(--fg-2);font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
.tn:hover{color:var(--fg);background:var(--surface)}
.tn.on{background:var(--accent-soft);color:var(--accent-text);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.tn .svg-i{width:19px;height:19px}
.tn .pill{background:var(--accent);color:var(--on-accent);border-radius:99px;font-size:.72rem;font-weight:800;padding:1px 7px}
.tn.round{width:44px;padding:0;justify-content:center;border-color:var(--line);background:var(--surface)}
@media(max-width:720px){.tn .lab{display:none}.tn{padding:0 12px}.brand-name{font-size:1.15rem}.logo{width:40px;height:40px}}

.closed-note{background:var(--bad-soft);color:var(--bad);padding:12px 16px;border-radius:14px;font-weight:600}

/* stories */
.stories{display:flex;gap:16px;overflow-x:auto;padding:2px 2px 4px;scrollbar-width:none}
.stories::-webkit-scrollbar{display:none}
.story{display:flex;flex-direction:column;align-items:center;gap:7px;border:0;background:none;cursor:pointer;flex:none;width:72px;padding:0;color:inherit}
.story-ring{width:68px;height:68px;border-radius:50%;padding:2.5px;background:linear-gradient(140deg,#FFB34D,var(--accent) 55%,#C95A00)}
.story-ring.seen{background:var(--line-2)}
.story-ring video{width:100%;height:100%;border-radius:50%;object-fit:cover;border:3px solid var(--bg);display:block}
.story-ring img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:3px solid var(--bg);display:block}
.story span{font-size:.74rem;color:var(--fg-2);max-width:72px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* hero + cards laterais */
.bento{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:20px}
.b-hero{position:relative;overflow:hidden;border-radius:26px;min-height:410px;background:var(--hero-bg);color:var(--hero-fg);border:1px solid var(--line-2);box-shadow:var(--shadow);isolation:isolate}
.b-hero .glow{position:absolute;inset:0;background:radial-gradient(70% 90% at 0% 0%,var(--glow),transparent 62%);z-index:0;pointer-events:none}
.b-hero .photo{position:absolute;top:0;bottom:0;right:0;width:58%;z-index:0}
.b-hero .photo img{width:100%;height:100%;object-fit:cover;object-position:center 40%;display:block;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 34%);mask-image:linear-gradient(90deg,transparent 0,#000 34%)}
.b-hero .photo .ph{width:100%;height:100%;border-radius:0}
.b-hero .copy{position:relative;z-index:1;display:flex;flex-direction:column;gap:16px;padding:30px 32px;max-width:56%;height:100%;min-height:410px}
.badge{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;background:color-mix(in srgb,var(--accent) 22%,transparent);color:#FFC27A;font-weight:600;font-size:.86rem;border:1px solid color-mix(in srgb,var(--accent) 35%,transparent)}
.badge .svg-i{width:16px;height:16px;color:var(--accent)}
.b-hero h1{font-size:clamp(2.1rem,5vw,3.6rem);font-weight:800;letter-spacing:-.035em;line-height:.98}
.b-hero h1 em{font-style:normal;color:var(--accent);display:block}
.b-hero .desc{color:var(--hero-fg-2);font-size:1.04rem;max-width:30ch;line-height:1.5}
.b-hero .buy{display:flex;align-items:center;gap:22px;margin-top:auto;flex-wrap:wrap}
.b-hero .price{font-size:2.1rem;font-weight:800;letter-spacing:-.02em}
.btn-add{display:inline-flex;align-items:center;gap:10px;height:54px;padding:0 26px;border-radius:999px;border:0;background:linear-gradient(180deg,#FFA53A,var(--accent));color:var(--on-accent);font-weight:700;font-size:1.04rem;cursor:pointer;
  box-shadow:0 10px 26px -8px rgba(255,148,31,.65),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s,box-shadow .15s}
.btn-add:hover{transform:translateY(-1px);box-shadow:0 14px 30px -8px rgba(255,148,31,.75),inset 0 1px 0 rgba(255,255,255,.35)}
.btn-add:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-add .svg-i{width:18px;height:18px}
.dots{position:absolute;left:50%;bottom:16px;transform:translateX(10%);display:flex;gap:8px;z-index:2}
.dots button{width:9px;height:9px;border-radius:99px;border:0;padding:0;background:rgba(255,255,255,.35);cursor:pointer;transition:width .25s,background .25s}
.dots button[aria-current="true"]{width:22px;background:var(--accent)}
.b-hero .heat{position:absolute;inset:0;z-index:0;pointer-events:none}

.b-side{display:grid;grid-template-rows:1fr 1fr;gap:20px}
.b-tile{position:relative;border-radius:22px;padding:24px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:10px;justify-content:center;box-shadow:var(--shadow);text-align:left;color:inherit;font:inherit;min-width:0}
button.b-tile{cursor:pointer;transition:border-color .2s,transform .2s}
button.b-tile:hover{border-color:var(--line-2);transform:translateY(-1px)}
.b-tile .tl-h{display:flex;align-items:center;gap:12px;color:var(--fg-2);font-weight:600}
.b-tile .tl-h .svg-i{width:30px;height:30px;color:var(--accent)}
.b-tile strong{font-family:var(--f-display);font-size:1.5rem;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.b-tile strong em{font-style:normal;color:var(--accent-text)}
.b-tile .sub{display:flex;align-items:center;gap:8px;color:var(--fg-2);font-size:.95rem}
.b-tile .sub .svg-i{width:18px;height:18px}
.b-tile .chev{position:absolute;right:20px;top:50%;transform:translateY(-50%);color:var(--fg-2)}
@media(max-width:900px){
  .bento{grid-template-columns:minmax(0,1fr)}
  .b-side{grid-template-columns:1fr 1fr;grid-template-rows:none;gap:12px}
  .b-tile{padding:16px}.b-tile strong{font-size:1.12rem}.b-tile .tl-h .svg-i{width:24px;height:24px}.b-tile .chev{display:none}
}
@media(max-width:600px){
  .b-hero{min-height:0}
  .b-hero .photo{position:relative;width:100%;height:240px}
  .b-hero .photo img{-webkit-mask-image:linear-gradient(0deg,transparent 0,#000 40%);mask-image:linear-gradient(0deg,transparent 0,#000 40%)}
  .b-hero .copy{max-width:none;min-height:0;height:auto;padding:0 20px 24px;margin-top:-56px}
  .b-hero .buy{margin-top:6px}
  .b-hero .glow{background:radial-gradient(90% 60% at 0% 100%,var(--glow),transparent 65%)}
  .dots{top:16px;bottom:auto;left:auto;right:16px;transform:none}
  .b-hero .price{font-size:1.7rem}
  .btn-add{height:50px;padding:0 22px}
}

/* categorias + busca */
.filters{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;gap:12px;align-items:center;padding-block:10px;margin-block:-10px}
.cats{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.cats::-webkit-scrollbar{display:none}
.cats button{flex:none;display:inline-flex;align-items:center;gap:9px;height:50px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:0 20px;font-weight:600;cursor:pointer;color:var(--fg);transition:background .2s,border-color .2s}
.cats button .svg-i{width:19px;height:19px;color:var(--fg-2)}
.cats button:hover{border-color:var(--line-2)}
.cats button[aria-pressed="true"]{background:linear-gradient(180deg,#FFA53A,var(--accent));color:var(--on-accent);border-color:transparent;box-shadow:0 8px 20px -10px rgba(255,148,31,.8)}
.cats button[aria-pressed="true"] .svg-i{color:var(--on-accent)}
.search{position:relative;flex:0 1 320px;min-width:0}
.search .svg-i{position:absolute;left:18px;top:50%;transform:translateY(-50%);color:var(--fg-2)}
.search input{width:100%;height:50px;border-radius:999px;border:1px solid var(--line);background:var(--surface);padding:0 18px 0 50px;outline:none;color:var(--fg)}
.search input::placeholder{color:var(--fg-3)}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
@media(max-width:760px){.filters{flex-direction:column;align-items:stretch;gap:10px}.search{flex:none}.cats button{height:44px;padding:0 16px}.search input{height:46px}}

/* seções e cards */
.sec{display:flex;flex-direction:column;gap:16px;scroll-margin-top:90px}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:12px}
.sec-h h2{font-size:1.7rem;font-weight:800;letter-spacing:-.025em;display:flex;align-items:center;gap:14px}
.sec-h h2::before{content:"";width:5px;height:28px;border-radius:3px;background:var(--accent)}
.see-all{border:0;background:none;color:var(--accent-text);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:1rem;padding:6px 2px}
.see-all .svg-i{width:18px;height:18px}
.plist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
@media(max-width:820px){.plist{grid-template-columns:minmax(0,1fr);gap:14px}.sec-h h2{font-size:1.4rem}}
.pcard{position:relative;display:grid;grid-template-columns:188px minmax(0,1fr);background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden;min-height:188px;box-shadow:var(--shadow);transition:border-color .2s,transform .2s}
.pcard:hover{border-color:var(--line-2)}
.pcard.off{opacity:.55}
.pcard .pimg{position:relative;background:var(--surface-2)}
.pcard .pimg img,.pcard .pimg .ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.pcard .pimg .ph{display:grid}
.pcard .info{display:flex;flex-direction:column;gap:6px;padding:20px 22px 18px;min-width:0}
.pcard h3{font-size:1.14rem;font-weight:700;letter-spacing:-.01em}

.track{display:flex;flex-direction:column;gap:0}
.tstep{display:grid;grid-template-columns:28px 1fr;gap:12px;position:relative;padding-bottom:18px}

.sv{position:fixed;inset:0;z-index:80;background:#000;display:flex;align-items:center;justify-content:center}

.c-foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:.85rem;color:var(--fg-3);padding-top:18px;border-top:1px solid var(--line)}

.m-info,.s-btn{display:none}

/* =================== ADMIN =================== */
/* Layout: barra lateral fixa + área de trabalho; cada aba é uma coluna de seções com função clara. */
.scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:29}
.a-shell{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh;min-height:100dvh}
.a-side{position:sticky;top:0;height:100vh;height:100dvh;background:color-mix(in srgb,var(--surface) 55%,var(--bg));border-right:1px solid var(--line);
  padding:22px 16px 18px;display:flex;flex-direction:column;gap:6px;overflow:auto;z-index:30}
.a-side .brand{padding:2px 8px 22px}
.a-side .logo{width:48px;height:48px}
.nav-btn{display:flex;align-items:center;gap:14px;border:0;background:transparent;padding:12px 16px;border-radius:16px;font-weight:600;font-size:.98rem;color:var(--fg-2);cursor:pointer;text-align:left;width:100%;text-decoration:none;transition:background .15s,color .15s}
.nav-btn .svg-i{width:22px;height:22px;color:var(--fg-3);transition:color .15s}
.nav-btn:hover{background:var(--surface-2);color:var(--fg)}
.nav-btn:hover .svg-i{color:var(--fg-2)}
.nav-btn[aria-current="page"]{background:linear-gradient(180deg,#FFA53A,var(--accent));color:var(--on-accent);box-shadow:0 10px 24px -12px rgba(255,148,31,.9)}
.nav-btn[aria-current="page"] .svg-i{color:var(--on-accent)}
.nav-btn .badge{margin-left:auto;min-width:24px;height:24px;display:grid;place-items:center;background:var(--surface-2);color:var(--fg);border-radius:99px;font-size:.76rem;font-weight:700;padding:0 7px;border:1px solid var(--line-2)}
.nav-btn[aria-current="page"] .badge{background:rgba(27,15,5,.18);border-color:transparent;color:var(--on-accent)}
.side-foot{margin-top:auto;padding-top:18px}
.store-card{border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.store-card .switch{padding:0}
.store-card small{color:var(--fg-3);font-size:.78rem}

.a-main{min-width:0;display:flex;flex-direction:column}
.a-top{position:sticky;top:0;z-index:25;display:flex;align-items:center;gap:14px;padding:16px 28px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid transparent}
.a-top .hello h1{font-size:1.3rem;font-weight:800}
.a-top .hello p{color:var(--fg-2);font-size:.88rem;margin-top:2px}
.a-top .hello{flex:1;min-width:0}
.icon-btn{position:relative;width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--fg);display:grid;place-items:center;cursor:pointer;flex:none}
.icon-btn .svg-i{width:21px;height:21px}
.icon-btn .dotn{position:absolute;top:-3px;right:-3px;min-width:20px;height:20px;border-radius:99px;background:#E5484D;color:#fff;font-size:.7rem;font-weight:800;display:grid;place-items:center;padding:0 5px;border:2px solid var(--bg)}
.avatar{display:flex;align-items:center;gap:8px;border:0;background:none;cursor:pointer;color:var(--fg-2);padding:0}
.avatar b{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(160deg,#FFB04A,#C95A00);color:var(--on-accent);font-weight:800;font-size:1.05rem}
.menu-btn{display:none}
.pop{position:absolute;right:28px;top:70px;width:min(340px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line-2);border-radius:18px;box-shadow:0 20px 50px rgba(0,0,0,.35);padding:8px;z-index:60;display:flex;flex-direction:column}
.pop .pop-h{padding:10px 12px 6px;font-weight:700}
.pop button,.pop a{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:none;padding:11px 12px;border-radius:12px;cursor:pointer;color:var(--fg);text-decoration:none;font-size:.92rem}
.pop button:hover,.pop a:hover{background:var(--surface-2)}
.pop .svg-i{color:var(--accent);flex:none}
.pop .sm{color:var(--fg-3);font-size:.8rem}

.a-body{padding:8px 28px 48px;min-width:0}
.a-inner{max-width:1360px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.page-h{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap}
.page-h h2{font-size:1.65rem;font-weight:800;letter-spacing:-.02em}
.page-h p{color:var(--fg-2);margin-top:4px}

/* blocos */
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:var(--shadow);min-width:0;display:flex;flex-direction:column;gap:16px}
.card.tight{padding:0;gap:0;overflow:hidden}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.card-h h3{display:flex;align-items:center;gap:12px;font-size:1.12rem;font-weight:700}
.card-h h3 .svg-i{width:24px;height:24px;color:var(--accent)}
.card.tight .card-h{padding:20px 22px 14px}
.link-btn{border:0;background:none;color:var(--accent-text);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:4px 0}
.link-btn .svg-i{width:17px;height:17px}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pills button{height:38px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg-2);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.pills button .n{font-size:.75rem;background:var(--bg);border-radius:99px;padding:1px 7px;color:var(--fg-2)}
.pills button[aria-pressed="true"]{background:linear-gradient(180deg,#FFA53A,var(--accent));color:var(--on-accent);border-color:transparent}
.pills button[aria-pressed="true"] .n{background:rgba(27,15,5,.18);color:var(--on-accent)}
.btn.primary{background:linear-gradient(180deg,#FFA53A,var(--accent));color:var(--on-accent);box-shadow:0 8px 20px -10px rgba(255,148,31,.8)}
.btn.primary:hover:not(:disabled){filter:brightness(1.05)}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.search-box{position:relative;min-width:220px;flex:1;max-width:380px}
.search-box .svg-i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--fg-3);width:18px;height:18px}
.search-box input{width:100%;height:44px;border-radius:999px;border:1px solid var(--line);background:var(--surface);padding:0 16px 0 42px;outline:none;color:var(--fg)}
.search-box input:focus{border-color:var(--accent)}

/* início */
.dash-top{display:grid;grid-template-columns:minmax(0,1.75fr) repeat(3,minmax(0,1fr));gap:18px}
.banner{position:relative;overflow:hidden;border-radius:22px;background:var(--hero-bg);color:var(--hero-fg);border:1px solid var(--line-2);min-height:190px;display:flex;align-items:center;box-shadow:var(--shadow);isolation:isolate}
.banner .glow{position:absolute;inset:0;background:radial-gradient(70% 120% at 0% 0%,var(--glow),transparent 60%);z-index:0}
.banner .photo{position:absolute;right:0;top:0;bottom:0;width:62%;z-index:0}
.banner .photo img{width:100%;height:100%;object-fit:cover;object-position:center 35%;-webkit-mask-image:linear-gradient(90deg,transparent,#000 40%);mask-image:linear-gradient(90deg,transparent,#000 40%)}
.banner .copy{position:relative;z-index:1;padding:24px 28px;display:flex;flex-direction:column;gap:12px;max-width:72%}
.banner h2{font-size:clamp(1.5rem,2.1vw,2.2rem);font-weight:800;letter-spacing:-.03em;line-height:1.02}
.banner h2 em{font-style:normal;color:var(--accent);display:block}
.banner .badge{white-space:nowrap;background:linear-gradient(180deg,#FFA53A,var(--accent));color:var(--on-accent);border:0;font-weight:700;cursor:pointer}
.banner .badge .svg-i{color:var(--on-accent)}
.stat{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:4px;box-shadow:var(--shadow);min-width:0}
.stat>.svg-i{width:32px;height:32px;color:var(--accent);margin-bottom:12px}
.stat .v{font-size:1.75rem;font-weight:800;letter-spacing:-.025em;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .l{color:var(--fg-2);font-size:.95rem}
.stat .d{margin-top:auto;padding-top:14px;font-weight:700;font-size:.88rem;display:flex;align-items:center;gap:4px}
.d.up{color:var(--good)} .d.down{color:var(--bad)} .d.flat{color:var(--fg-3)}
.stat .spark{position:absolute;right:10px;bottom:12px;width:46%;height:48px}
.dash-mid{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(0,1fr);gap:18px}
.dash-bot{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(0,1fr);gap:18px}
.big-num{font-size:2rem;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.chart-box{position:relative;height:260px}
.chart-box.sm{height:200px}
.qa-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;flex:1}
.qa{position:relative;text-align:left;border:1px solid var(--line);background:var(--surface-2);border-radius:18px;padding:18px 40px 18px 18px;cursor:pointer;display:flex;flex-direction:column;gap:4px;color:inherit;font:inherit;transition:border-color .15s,transform .15s}
.qa:hover{border-color:var(--line-2);transform:translateY(-1px)}
.qa>.svg-i{width:30px;height:30px;color:var(--accent);margin-bottom:8px}
.qa b{font-size:1rem}
.qa span{color:var(--fg-2);font-size:.86rem}
.qa .chev{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--fg-2)}
.tip{position:relative;overflow:hidden;border-radius:22px;background:var(--hero-bg);color:var(--hero-fg);border:1px solid var(--line-2);display:grid;grid-template-columns:42% 1fr;min-height:210px;box-shadow:var(--shadow)}
.tip img{width:100%;height:100%;object-fit:cover;-webkit-mask-image:linear-gradient(90deg,#000 60%,transparent);mask-image:linear-gradient(90deg,#000 60%,transparent)}
.tip .copy{padding:20px 22px 20px 8px;display:flex;flex-direction:column;gap:8px;justify-content:center}
.tip .badge{font-size:.76rem;padding:4px 10px}
.tip h3{font-size:1.25rem;font-weight:800;line-height:1.15}
.tip p{color:var(--hero-fg-2);font-size:.9rem}
.tip .btn{align-self:flex-end;margin-top:6px}

/* tabelas */
.tbl-wrap{overflow-x:auto}
table.tbl{border-collapse:collapse;width:100%;font-size:.93rem;font-variant-numeric:tabular-nums}
.tbl th{font-size:.82rem;color:var(--fg-3);font-weight:600;text-align:left;padding:10px 22px;white-space:nowrap;border-bottom:1px solid var(--line)}
.tbl td{padding:14px 22px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tbody tr.click{cursor:pointer}
.tbl tbody tr.click:hover td{background:var(--surface-2)}
.tbl td.r,.tbl th.r{text-align:right}
.tbl .oid{display:inline-flex;align-items:center;gap:10px;font-weight:700}
.tbl .sub{color:var(--fg-3);font-size:.82rem}
.tbl .clip{max-width:220px;overflow:hidden;text-overflow:ellipsis}
.tbl tfoot td{font-weight:800;background:var(--surface-2);border-bottom:0}
.st{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;font-size:.8rem;font-weight:700;white-space:nowrap}
.st.novo{background:var(--accent-soft);color:var(--accent-text);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 45%,transparent)}
.st.preparando{background:#C25E0A;color:#FFF3E6}
.st.pronto{background:var(--warn-soft);color:var(--warn)}
.st.saiu{background:#1C3A66;color:#D7E6FF}
.st.entregue{background:#17452B;color:#C9F2D8}
.st.cancelado{background:var(--bad-soft);color:var(--bad)}
:root[data-theme="light"] .st.preparando{background:#FFE3C7;color:#9A4A06}
:root[data-theme="light"] .st.saiu{background:#DCE8FB;color:#1D4C8F}
:root[data-theme="light"] .st.entregue{background:#DDF2E4;color:#1F6B3C}
.pay{font-size:.8rem;font-weight:700;padding:3px 9px;border-radius:8px;white-space:nowrap}
.pay.pago{color:var(--good);background:var(--good-soft)} .pay.pendente{color:var(--bad);background:var(--bad-soft)}
.pay.fiado{color:var(--warn);background:var(--warn-soft)} .pay.estornado{color:var(--fg-3);background:var(--surface-2)}
.empty-row{padding:34px 22px;text-align:center;color:var(--fg-2)}

/* vendas (balcão) */
.pos-search{position:relative}
.pos-search .bar{display:flex;gap:10px;align-items:center}
.pos-search .inp{position:relative;flex:1;min-width:0}
.pos-search .inp .svg-i{position:absolute;left:18px;top:50%;transform:translateY(-50%);color:var(--accent);width:22px;height:22px}
.pos-search input#ps-q{width:100%;height:60px;border-radius:16px;border:1px solid var(--line-2);background:var(--bg);padding:0 18px 0 54px;font-size:1.12rem;outline:none;color:var(--fg)}
.pos-search input#ps-q:focus{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 18%,transparent)}
.pos-search input#ps-qty{width:86px;height:60px;border-radius:16px;border:1px solid var(--line-2);background:var(--bg);text-align:center;font-size:1.12rem;font-weight:700;outline:none;color:var(--fg)}
.kbd{font-size:.76rem;color:var(--fg-3);border:1px solid var(--line-2);border-radius:6px;padding:1px 6px;background:var(--surface-2)}
.ps-res{position:absolute;left:0;right:96px;top:66px;z-index:20;background:var(--surface);border:1px solid var(--line-2);border-radius:16px;box-shadow:0 20px 50px rgba(0,0,0,.35);overflow:hidden;max-height:340px;overflow-y:auto}
.ps-res button{display:grid;grid-template-columns:auto 44px minmax(0,1fr) auto;align-items:center;gap:12px;width:100%;border:0;background:none;padding:10px 14px;text-align:left;cursor:pointer;color:var(--fg);border-bottom:1px solid var(--line)}
.ps-res button:last-child{border-bottom:0}
.ps-res button[aria-selected="true"],.ps-res button:hover{background:var(--surface-2)}
.ps-res button:disabled{opacity:.45;cursor:not-allowed}
.ps-res img,.ps-res .ph{width:44px;height:44px;border-radius:10px;object-fit:cover}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.8rem;font-weight:700;color:var(--accent-text);background:var(--accent-soft);padding:2px 7px;border-radius:7px;white-space:nowrap}
.shortcuts{display:flex;gap:8px;flex-wrap:wrap}
.shortcuts button{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);cursor:pointer;font-weight:600;font-size:.86rem}
.shortcuts button:hover{border-color:var(--accent)}
.pos-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(320px,1fr);gap:18px;align-items:start}
.qty{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line-2);border-radius:999px;padding:2px}
.qty button{width:30px;height:30px;border-radius:50%;border:0;background:var(--surface-2);color:var(--fg);cursor:pointer;font-weight:800}
.qty b{min-width:28px;text-align:center}
.x-btn{border:0;background:none;color:var(--fg-3);cursor:pointer;font-size:1.1rem;width:30px;height:30px;border-radius:50%}
.x-btn:hover{background:var(--bad-soft);color:var(--bad)}
.pay-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pay-grid button{height:46px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface-2);color:var(--fg);font-weight:700;cursor:pointer}
.pay-grid button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-text)}
.total-line{display:flex;justify-content:space-between;align-items:baseline;padding-top:12px;border-top:1px dashed var(--line-2)}
.total-line b{font-size:2rem;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.warn-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--warn-soft);color:var(--warn);border-radius:16px;padding:14px 18px;font-weight:600}


/* vendas: tela inicial, venda e vendas de hoje */
.sheet.wide{max-width:1080px}
@media(min-width:720px){.sheet.wide{max-height:92vh}}
.sale-home{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:18px}
.sale-cta{position:relative;overflow:hidden;isolation:isolate;display:flex;flex-direction:column;align-items:flex-start;gap:18px;text-align:left;border:1px solid var(--line-2);border-radius:24px;padding:30px;cursor:pointer;
  background:radial-gradient(70% 120% at 0% 0%,var(--glow),transparent 60%),var(--hero-bg);color:var(--hero-fg);font:inherit;min-height:250px;box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
.sale-cta:hover{transform:translateY(-2px);border-color:var(--accent)}
.sale-cta .ic{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 22%,transparent);color:var(--accent)}
.sale-cta .ic .svg-i{width:34px;height:34px}
.sale-cta .tx{display:flex;flex-direction:column;gap:6px}
.sale-cta .tx b{font-size:1.9rem;font-weight:800;letter-spacing:-.03em}
.sale-cta .tx span{color:var(--hero-fg-2);max-width:40ch}
.sale-cta .go{margin-top:auto;display:inline-flex;align-items:center;gap:8px;height:50px;padding:0 24px;border-radius:999px;background:linear-gradient(180deg,#FFA53A,var(--accent));color:var(--on-accent);font-weight:800;box-shadow:0 10px 24px -10px rgba(255,148,31,.8)}
.sale-cta .go .svg-i{width:18px;height:18px}
.sale-today{display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;border:1px solid var(--line);border-radius:24px;padding:26px;cursor:pointer;background:var(--surface);color:var(--fg);font:inherit;box-shadow:var(--shadow);transition:border-color .15s}
.sale-today:hover{border-color:var(--line-2)}
.sale-today .l{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--fg-2)}
.sale-today .l .svg-i{color:var(--accent)}
.sale-today .v{font-size:2.2rem;font-weight:800;letter-spacing:-.03em}
.sale-today .s{color:var(--fg-2);font-size:.92rem}
.sale-today .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.sale-today .pend{font-size:.85rem;font-weight:700;color:var(--bad);background:var(--bad-soft);padding:4px 10px;border-radius:8px}
.tchip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:.78rem;font-weight:700;white-space:nowrap;border:1px solid var(--line-2);background:var(--surface-2);color:var(--fg-2)}
.tchip .svg-i{width:14px;height:14px}
.tchip.bal .svg-i{color:var(--fg-2)} .tchip.ret .svg-i{color:var(--warn)} .tchip.ent .svg-i{color:var(--accent)}
.sale{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(300px,1fr);gap:18px;min-height:0}
.sale-left{display:flex;flex-direction:column;gap:12px;min-width:0}
.sale-right{display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;align-self:start;position:sticky;top:0;min-width:0}
.sale-right h3{font-size:1.05rem}
.sm-search{position:relative;display:block}
.sm-search .svg-i{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--accent);width:20px;height:20px}
.sm-search input{width:100%;height:54px;border-radius:14px;border:1px solid var(--line-2);background:var(--surface);padding:0 16px 0 48px;font-size:1.05rem;outline:none;color:var(--fg)}
.sm-search input:focus{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 18%,transparent)}
.sm-list{display:flex;flex-direction:column;gap:8px;max-height:56vh;overflow-y:auto;padding-right:2px}
.sm-item{display:grid;grid-template-columns:52px minmax(0,1fr) auto 40px;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:8px 10px 8px 8px;cursor:pointer;color:var(--fg);font:inherit;transition:border-color .12s}
.sm-item:hover,.sm-item[aria-selected="true"]{border-color:var(--accent)}
.sm-item:disabled{opacity:.45;cursor:not-allowed}
.sm-item img,.sm-item .ph{width:52px;height:52px;border-radius:10px;object-fit:cover}
.sm-item .ph .svg-i{width:24px;height:24px}
.sm-item .nm{display:flex;flex-direction:column;min-width:0}
.sm-item .nm b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sm-item .nm span{font-size:.8rem;color:var(--fg-3)}
.sm-item .pr{font-weight:800}
.sm-item .plus{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-text)}
.sm-item .plus .svg-i{width:16px;height:16px}
.sm-cart{display:flex;flex-direction:column;max-height:34vh;overflow-y:auto}
.sm-line{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.sm-line:last-child{border-bottom:0}
.sm-line .grow{flex:1;min-width:0;display:flex;flex-direction:column}
.sm-line .grow b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sm-line .grow span{font-size:.8rem}
.sm-pays{background:var(--surface-2);border-radius:14px;padding:4px 12px}
.big-btn{min-height:54px;font-size:1.04rem}
.big-btn .svg-i{width:18px;height:18px}
.big-in{font-size:1.5rem!important;font-weight:800;height:60px;text-align:center}
.pay-need{display:flex;justify-content:space-between;align-items:baseline;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.pay-need span{color:var(--fg-2);font-weight:600}
.pay-need b{font-size:1.9rem;font-weight:800;letter-spacing:-.03em}
.pay-methods{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.pay-methods button{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 6px;border-radius:16px;border:1px solid var(--line-2);background:var(--surface);color:var(--fg);font-weight:700;cursor:pointer;font-size:.92rem}
.pay-methods button .svg-i{width:24px;height:24px;color:var(--accent)}
.pay-methods button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-text)}
#sm-form{display:flex;flex-direction:column;gap:12px}
#sm-form:empty{display:none}
.pay-done{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:30px 16px;border-radius:18px;background:var(--good-soft);color:var(--good)}
.pay-done .svg-i{width:40px;height:40px}
.pay-done b{font-size:1.2rem}
.sale-ok{grid-column:1/-1;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding:36px 16px}
.sale-ok>.svg-i{width:64px;height:64px;color:var(--on-accent);background:linear-gradient(180deg,#FFA53A,var(--accent));border-radius:50%;padding:14px}
.sale-ok h3{font-size:1.5rem}
.sm-bar{display:none}
@media(max-width:860px){.sheet.wide{scroll-padding-bottom:96px}.sm-bar:not([hidden]){display:flex;position:sticky;bottom:calc(-20px - env(safe-area-inset-bottom,0px));margin:0 -18px calc(-20px - env(safe-area-inset-bottom,0px));padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));
  background:var(--surface);border-top:1px solid var(--line-2);justify-content:space-between;align-items:center;gap:12px;z-index:5;box-shadow:0 -10px 30px rgba(0,0,0,.25)}
  .sm-bar b{font-size:1.2rem}}
.ts-list{display:flex;flex-direction:column;gap:8px}
.ts-row{display:grid;grid-template-columns:54px minmax(0,1fr) auto auto 100px;align-items:center;gap:14px;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:12px 16px;cursor:pointer;color:var(--fg);font:inherit}
.ts-row:hover{border-color:var(--line-2)}
.ts-row.canc{opacity:.55}
.ts-row .t{color:var(--fg-3);font-weight:600}
.ts-row .who2{display:flex;flex-direction:column;min-width:0}
.ts-row .who2 b,.ts-row .who2 span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ts-row .who2 span{font-size:.84rem}
.ts-row .pm{font-size:.85rem;color:var(--fg-2);text-align:right;line-height:1.7}
.ts-row .val{text-align:right;font-size:1.05rem}
@media(max-width:860px){
  .sale-home{grid-template-columns:minmax(0,1fr)}
  .sale{grid-template-columns:minmax(0,1fr)}
  .sale-right{position:static}
  .sm-list{max-height:none}
  .pay-methods{grid-template-columns:repeat(3,minmax(0,1fr))}
  .ts-row{grid-template-columns:44px minmax(0,1fr) auto;row-gap:6px}
  .ts-row .pm{grid-column:2;text-align:left}
  .ts-row .val{grid-column:3;grid-row:1}
  .ts-row .tchip{grid-column:3;grid-row:2;justify-self:end}
}
@media(max-width:640px){.sale-cta{padding:22px;min-height:0}.sale-cta .tx b{font-size:1.5rem}.sale-today{padding:20px}}


/* pedido novo, aceite e recibo */
.sheet.incoming{max-width:620px;border:1px solid var(--line-2);box-shadow:0 30px 80px rgba(0,0,0,.5);animation:incin .35s cubic-bezier(.2,.9,.25,1.2)}
@keyframes incin{from{transform:translateY(24px) scale(.96);opacity:0}}
.inc-top{display:flex;align-items:center;gap:16px;position:relative}
.inc-top h2{font-size:1.6rem;font-weight:800}
.inc-pulse{width:56px;height:56px;flex:none;border-radius:18px;display:grid;place-items:center;background:linear-gradient(180deg,#FFA53A,var(--accent));color:var(--on-accent);box-shadow:0 0 0 0 rgba(255,148,31,.6);animation:pulse 1.6s infinite}
.inc-pulse .svg-i{width:28px;height:28px}
@keyframes pulse{70%{box-shadow:0 0 0 16px rgba(255,148,31,0)}100%{box-shadow:0 0 0 0 rgba(255,148,31,0)}}
.inc-more{position:absolute;right:0;top:0;background:var(--accent-soft);color:var(--accent-text);font-weight:700;font-size:.8rem;padding:4px 10px;border-radius:99px}
#inc-body{display:flex;flex-direction:column;gap:12px}
.inc-cust{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.inc-addr{display:flex;gap:10px;font-size:.92rem;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.inc-addr>.svg-i{color:var(--accent);flex:none}
.inc-items{display:flex;flex-direction:column;gap:8px;max-height:34vh;overflow-y:auto}
.inc-it{display:grid;grid-template-columns:48px auto minmax(0,1fr) auto;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 12px 6px 6px}
.inc-it img,.inc-it .ph{width:48px;height:48px;border-radius:10px;object-fit:cover}
.inc-it .ph .svg-i{width:22px;height:22px}
.inc-it .q{font-weight:800;color:var(--accent-text)}
.inc-it .n{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.inc-note{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 12px;font-weight:600;font-size:.92rem}
.inc-sum{padding:0 4px}
.inc-act{display:grid;grid-template-columns:1fr 2fr;gap:10px}
.inc-act .btn{min-height:56px}
.inc-done{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding:18px 6px 6px}
.inc-done>.svg-i{width:60px;height:60px;color:var(--on-accent);background:linear-gradient(180deg,#FFA53A,var(--accent));border-radius:50%;padding:14px}
.inc-done h3{font-size:1.4rem}
.await{display:flex;flex-direction:column;gap:12px;border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);background:radial-gradient(60% 120% at 0% 0%,color-mix(in srgb,var(--accent) 12%,transparent),transparent 60%),var(--surface);border-radius:22px;padding:18px 20px}
.await:not(.hot){border-color:var(--line);background:var(--surface)}
.await .card-h h3 .svg-i{color:var(--accent)}
.await.muted-sec .aw{opacity:.85}
.aw.canc{opacity:.55}
.aw-addr{display:flex;gap:8px;font-size:.86rem;color:var(--fg-2)}
.aw-addr .svg-i{width:16px;height:16px;color:var(--accent);flex:none;margin-top:2px}
.aw-note{font-size:.84rem;background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:6px 9px;font-weight:600}
.await-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.aw{background:var(--bg);border:1px solid var(--line-2);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.aw-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.aw-h>div{display:flex;flex-direction:column}.aw-h .faint{font-size:.82rem}
.aw-items{display:flex;flex-wrap:wrap;gap:6px}
.aw-items span{font-size:.84rem;background:var(--surface-2);padding:3px 9px;border-radius:8px}
.aw-f{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:4px}
.rcpt-prev{background:#E9E4DD;border-radius:16px;padding:16px;display:flex;justify-content:center;max-height:60vh;overflow:auto}
.rcpt-prev iframe{width:330px;max-width:100%;height:560px;border:0;background:#fff;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.mag{transform-origin:center;transition:none;backface-visibility:hidden;-webkit-font-smoothing:subpixel-antialiased}

function errMsg(e) {
  const m = String(e?.message || e || "");
  const code = Object.keys(ERR).find(k => m.includes(k));
  if (code) return ERR[code];
  let r = m.match(/SEM_ESTOQUE:([^:]+):(\d+)/);
  if (r) return `${r[1]}: só restam ${r[2]} no estoque.`;
  r = m.match(/PRODUTO_INDISPONIVEL:(.+)/);
  if (r) return `${r[1]} não está mais disponível.`;
  r = m.match(/PEDIDO_MINIMO:([\d.]+)/);
  if (r) return `Pedido mínimo para entrega: ${money(r[1])}.`;
  if (/products_code_key/.test(m)) return "Esse código já está em outro produto. Use outro.";
  if (/Invalid login/i.test(m)) return "E-mail ou senha incorretos.";
  if (/Email not confirmed/i.test(m)) return "Confirme seu e-mail pelo link que enviamos e tente de novo.";
  if (/already registered/i.test(m)) return "Esse e-mail já tem conta. Use Entrar.";
  return m || "Algo deu errado. Tente de novo.";
}

/* fotos padrão até o dono subir as dele */
function photoFor(p) {
  if (p.image_url) return p.image_url;
  if (typeof PHOTOS === "undefined") return null;
  const n = (p.name || "").toLowerCase();
  const k = /kit|festa/.test(n) ? "kit" : /coxinha/.test(n) ? "coxinha" : /kibe|quibe/.test(n) ? "kibe" : /bolinha|queijo/.test(n) && !/risole/.test(n) ? "bolinha"
    : /esfiha|esfirra/.test(n) ? "esfiha" : /enroladinho|salsicha/.test(n) ? "enroladinho" : /combo/.test(n) ? "kit" : null;
  return k ? PHOTOS[k] : null;
}

/* cálculo de frete (mesma regra do banco) */
function calcFee(s, km, subtotal) {
  if (km > Number(s.delivery_max_km)) return { ok: false, reason: "FORA_DO_RAIO", distance_km: km };
  let fee = Number(s.delivery_base_fee) + Number(s.delivery_per_km) * Math.max(0, km - Number(s.delivery_included_km));
  fee = Math.ceil(fee * 2) / 2;
  if (s.free_delivery_over != null && s.free_delivery_over !== "" && subtotal >= Number(s.free_delivery_over)) fee = 0;
  return { ok: true, distance_km: n2(km), fee };
}
function haversine(a, b, c, d) {
  const R = 6371, r = x => x * Math.PI / 180;
  const h = Math.sin(r(c - a) / 2) ** 2 + Math.cos(r(a)) * Math.cos(r(c)) * Math.sin(r(d - b) / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

/* ================= backend Supabase ================= */
function makeSupabaseApi(sb) {
  const q = async p => { const { data, error } = await p; if (error) throw error; return data; };
  const rpc = (fn, args) => q(sb.rpc(fn, args));
  async function all(build) {
    let out = [], from = 0, step = 1000;
    for (;;) { const rows = await q(build().range(from, from + step - 1)); out = out.concat(rows); if (rows.length < step) break; from += step; }
    return out;
  }
  const api = {
    mode: "supabase",
    settings: () => q(sb.from("store_settings").select("*").eq("id", 1).single()),
    saveSettings: patch => q(sb.from("store_settings").update({ ...patch, updated_at: new Date().toISOString() }).eq("id", 1).select().single()),
    categories: () => q(sb.from("categories").select("*").order("sort")),
    saveCategory: c => c.id ? q(sb.from("categories").update({ name: c.name, sort: c.sort }).eq("id", c.id)) : q(sb.from("categories").insert({ name: c.name, sort: c.sort || 0 })),
    deleteCategory: id => q(sb.from("categories").delete().eq("id", id)),
    products: () => q(sb.from("products").select("*").order("sort").order("name")),

    deleteProduct: id => q(sb.from("products").delete().eq("id", id)),
    setStock: (id, stock) => q(sb.from("products").update({ stock, updated_at: new Date().toISOString() }).eq("id", id)),
    stories: () => q(sb.from("stories").select("*").order("created_at", { ascending: false })),
    addStory: s => q(sb.from("stories").insert({ image_url: s.image_url, caption: s.caption, media_type: s.media_type || "image", expires_at: new Date(Date.now() + (s.hours || 24) * 36e5).toISOString() })),
    deleteStory: id => q(sb.from("stories").delete().eq("id", id)),
    async upload(file) {
      const ext = (file.name.split(".").pop() || "jpg").toLowerCase();
      const path = `${new Date().getFullYear()}/${uid()}.${ext}`;
      const { error } = await sb.storage.from("media").upload(path, file, { contentType: file.type, upsert: false });

      return sb.storage.from("media").getPublicUrl(path).data.publicUrl;
    },
    quote: (lat, lng, routeKm, subtotal) => rpc("quote_delivery", { p_lat: lat, p_lng: lng, p_route_km: routeKm, p_subtotal: subtotal }),
    placeOrder: p => rpc("place_order", { p }),
    orderPublic: id => rpc("get_order_public", { p_id: id }),
    setOptin: (id, phone, v) => rpc("set_marketing_optin", { p_order: id, p_phone: phone, p_optin: v }),
    logMessages: rows => q(sb.from("message_log").insert(rows)),
    messageLog: () => q(sb.from("message_log").select("*").order("created_at", { ascending: false }).limit(200)),
    async waSend(payload) { const { data, error } = await sb.functions.invoke("whatsapp-send", { body: payload });
      if (error) { let m = error.message; try { m = (await error.context.json()).error || m; } catch {} throw new Error(m); } return data; },
    orders: ({ from, to } = {}) => all(() => { let b = sb.from("orders").select("*, order_items(*)").order("created_at", { ascending: false });
      if (from) b = b.gte("created_at", from.toISOString()); if (to) b = b.lt("created_at", to.toISOString()); return b; }),
    order: id => q(sb.from("orders").select("*, order_items(*)").eq("id", id).single()),
    setStatus: (id, s) => rpc("set_order_status", { p_order: id, p_status: s }),
    payOrder: (id, method, customerId) => rpc("pay_order", { p_order: id, p_method: method, p_customer: customerId || null }),
    customers: () => q(sb.from("customer_balances").select("*").order("name")),
    saveCustomer: c => { const { id, balance, last_movement, created_at, ...rest } = c;
      return id ? q(sb.from("customers").update(rest).eq("id", id).select().single()) : q(sb.from("customers").insert(rest).select().single()); },
    customerLedger: id => q(sb.from("customer_ledger").select("*").eq("customer_id", id).order("created_at", { ascending: false })),
    receiveDebt: (cid, amt, method, desc) => rpc("receive_debt", { p_customer: cid, p_amount: amt, p_method: method, p_desc: desc || null }),
    addDebt: (cid, amt, desc) => rpc("add_debt", { p_customer: cid, p_amount: amt, p_desc: desc }),
    async cashCurrent() {
      const s = await q(sb.from("cash_sessions").select("*").eq("status", "aberto").maybeSingle());
      if (!s) return null;
      s.movements = await q(sb.from("cash_movements").select("*").eq("session_id", s.id).order("created_at", { ascending: false }));
      return s;
    },
    openCash: (amt, notes) => rpc("open_cash", { p_amount: amt, p_notes: notes || null }),
    cashMove: (kind, amt, method, desc) => rpc("cash_move", { p_kind: kind, p_amount: amt, p_method: method, p_desc: desc || null }),
    closeCash: (counted, notes) => rpc("close_cash", { p_counted: counted, p_notes: notes || null }),
    cashSessions: ({ from } = {}) => all(() => { let b = sb.from("cash_sessions").select("*, cash_movements(*)").order("opened_at", { ascending: false });
      if (from) b = b.gte("opened_at", from.toISOString()); return b; }),
    async getUser() { const { data } = await sb.auth.getSession(); return data.session?.user || null; },
    async signIn(email, password) { const { error } = await sb.auth.signInWithPassword({ email, password }); if (error) throw error; },
    async signUp(email, password) { const { data, error } = await sb.auth.signUp({ email, password }); if (error) throw error; return !!data.session; },
    signOut: () => sb.auth.signOut(),
    claimAdmin: () => rpc("claim_admin"),
    async startOnlinePayment(orderId) {
      // Caminho aberto para o Mercado Pago: uma Edge Function "mp-checkout" cria a preferência
      // com o Access Token guardado no servidor e devolve o link de pagamento.
      const { data, error } = await sb.functions.invoke("mp-checkout", { body: { order_id: orderId } });
      if (error || !data?.init_point) throw new Error("Pagamento online ainda não foi ativado pela loja.");
      return data.init_point;
    },
    subscribeAll() {
      const ch = sb.channel("bs-live");
      [["products", "products"], ["store_settings", "settings"], ["stories", "stories"], ["categories", "products"], ["orders", "orders"]]
        .forEach(([t, ev]) => ch.on("postgres_changes", { event: "*", schema: "public", table: t }, p => bus.emit(ev, p)));
      ch.subscribe();
    }
  };
  return api;
}

    async deleteProduct(id) { S.products = S.products.filter(x => x.id !== id); tick("products"); },
    async setStock(id, stock) { S.products.find(x => x.id === id).stock = stock; tick("products"); },
    async stories() { return clone(S.stories); },
    async addStory(s) { S.stories.unshift({ id: uid(), image_url: s.image_url, caption: s.caption, media_type: s.media_type || "image", created_at: new Date().toISOString(), expires_at: new Date(Date.now() + (s.hours || 24) * 36e5).toISOString() }); tick("stories"); },
    async deleteStory(id) { S.stories = S.stories.filter(s => s.id !== id); tick("stories"); },
    upload: file => file.type.startsWith("video") ? Promise.resolve(URL.createObjectURL(file)) : new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); }),
    async quote(lat, lng, routeKm, subtotal) {
      if (!S.settings.delivery_enabled) return { ok: false, reason: "ENTREGA_DESATIVADA" };
      return calcFee(S.settings, Math.max(routeKm || 0, haversine(S.settings.lat, S.settings.lng, lat, lng)), subtotal);
    },
    async placeOrder(p) {
      const s = S.settings, ch = p.channel || "app";
      if (ch === "balcao" && !isAdmin()) fail("SOMENTE_ADMIN");
      if (ch === "app" && !s.is_open) fail("LOJA_FECHADA");
      if (!String(p.customer_name || "").trim()) fail("NOME_OBRIGATORIO");
      if (!p.items?.length) fail("CARRINHO_VAZIO");
      if (p.payment_method === "fiado" && !p.customer_id) fail("CLIENTE_OBRIGATORIO_FIADO");
      for (const it of p.items) { const pr = S.products.find(x => x.id === it.product_id);
        if (!pr || !pr.is_active) fail("PRODUTO_INDISPONIVEL:" + (pr?.name || "?"));
        if (pr.track_stock && pr.stock < it.qty) fail(`SEM_ESTOQUE:${pr.name}:${pr.stock}`); }
      const items = p.items.map(it => { const pr = S.products.find(x => x.id === it.product_id); if (pr.track_stock) pr.stock -= it.qty;
        return { id: uid(), product_id: pr.id, name: pr.name, unit_price: pr.price, unit_cost: pr.cost, qty: it.qty, total: pr.price * it.qty }; });
      const sub = items.reduce((a, b) => a + b.total, 0);
      let fee = 0, dist = null;
      if (ch === "app" && p.fulfillment === "entrega") { const qd = await api.quote(p.lat, p.lng, p.distance_km, sub); if (!qd.ok) fail(qd.reason); fee = qd.fee; dist = qd.distance_km; }
      else if (ch === "balcao") fee = Number(p.delivery_fee || 0);
      const disc = Number(p.discount || 0);
      const o = { id: uid(), code: S.code++, channel: ch, customer_id: p.customer_id || null, customer_name: p.customer_name.trim(), customer_phone: p.customer_phone || null,
        fulfillment: ch === "balcao" ? "balcao" : p.fulfillment, address: p.address || null, address_ref: p.address_ref || null, distance_km: dist,
        subtotal: sub, delivery_fee: fee, discount: disc, total: Math.max(0, sub + fee - disc), payment_method: p.payment_method, change_for: p.change_for || null,
        payment_status: "pendente", status: "novo", notes: p.notes || null, created_at: new Date().toISOString(), updated_at: new Date().toISOString(), order_items: items };
      S.orders.push(o);
      if (p.payments?.length) o.payment_method = p.payments.length > 1 ? "misto" : p.payments[0].method;
      if (ch === "balcao" && p.pay_now) { if (p.payments?.length) paySplit(o, p.payments, p.customer_id); else pay(o, p.payment_method, p.customer_id); o.status = "entregue"; }
      tick("products"); tick("orders", { eventType: "INSERT", new: o });
      return { id: o.id, code: o.code, subtotal: sub, delivery_fee: fee, total: o.total };
    },
    async order(id) { return clone(S.orders.find(x => x.id === id)); },
    async setOptin(id, phone, v) { const o = S.orders.find(x => x.id === id); if (o) o.marketing_optin = v; },
    async logMessages(rows) { rows.forEach(r => S.log.unshift({ id: uid(), created_at: new Date().toISOString(), status: "enviado", ...r })); },
    async messageLog() { return clone(S.log); },
    async waSend() { throw new Error("WHATSAPP_NAO_CONFIGURADO"); },
    async orderPublic(id) { const o = S.orders.find(x => x.id === id); if (!o) return null;
      return { ...clone(o), items: o.order_items.map(i => ({ name: i.name, qty: i.qty, total: i.total })) }; },
    async orders({ from, to } = {}) { return clone(S.orders.filter(o => (!from || new Date(o.created_at) >= from) && (!to || new Date(o.created_at) < to))
      .sort((a, b) => b.created_at.localeCompare(a.created_at))); },
    async setStatus(id, st) { const o = S.orders.find(x => x.id === id); if (o.status === "cancelado") fail("PEDIDO_CANCELADO");
      if (st === "cancelado") { o.order_items.forEach(i => { const p = S.products.find(x => x.id === i.product_id); if (p?.track_stock) p.stock += i.qty; });
        if (["pago", "fiado"].includes(o.payment_status) && o.total > 0) { const parts = o.payments || [{ method: o.payment_method, amount: o.total }]; const s = openSess();
          if (parts.some(x => x.method !== "fiado") && !s) fail("CAIXA_FECHADO"); const t = new Date().toISOString();
          parts.forEach(x => x.method === "fiado" ? o.customer_id && S.ledger.push({ id: uid(), customer_id: o.customer_id, kind: "ajuste", amount: Number(x.amount), description: "Cancelamento pedido #" + o.code, created_at: t })
            : S.movements.push({ id: uid(), session_id: s.id, kind: "estorno", method: x.method, amount: Number(x.amount), description: "Estorno pedido #" + o.code, order_id: o.id, created_at: t }));
          o.payment_status = "estornado"; } }
      o.status = st; o.updated_at = new Date().toISOString(); tick("orders"); tick("products"); },
    async payOrder(id, method, cid) { pay(S.orders.find(x => x.id === id), method, cid); tick("orders"); },
    async customers() { return clone(S.customers.map(c => { const l = S.ledger.filter(x => x.customer_id === c.id);
      return { ...c, balance: n2(l.filter(x => x.kind === "debito").reduce((a, x) => a + x.amount, 0) - l.filter(x => x.kind !== "debito").reduce((a, x) => a + x.amount, 0)),
        last_movement: l.map(x => x.created_at).sort().pop() || null }; }).sort((a, b) => a.name.localeCompare(b.name))); },
    async saveCustomer(c) { const { balance, last_movement, ...r } = c; if (r.id) { Object.assign(S.customers.find(x => x.id === r.id), r); return r; }
      const n = { ...r, id: uid(), is_active: true, created_at: new Date().toISOString() }; S.customers.push(n); return n; },
    async customerLedger(id) { return clone(S.ledger.filter(x => x.customer_id === id).sort((a, b) => b.created_at.localeCompare(a.created_at))); },
    async receiveDebt(cid, amt, method, desc) { const s = openSess(); if (!s) fail("CAIXA_FECHADO"); const c = S.customers.find(x => x.id === cid); const t = new Date().toISOString();
      S.ledger.push({ id: uid(), customer_id: cid, kind: "pagamento", amount: amt, description: desc || "Pagamento de fiado", method, created_at: t });
      S.movements.push({ id: uid(), session_id: s.id, kind: "recebimento_fiado", method, amount: amt, description: "Fiado · " + c.name, customer_id: cid, created_at: t }); },
    async addDebt(cid, amt, desc) { S.ledger.push({ id: uid(), customer_id: cid, kind: "debito", amount: amt, description: desc, created_at: new Date().toISOString() }); },
    async cashCurrent() { const s = openSess(); if (!s) return null;
      return { ...clone(s), movements: clone(S.movements.filter(m => m.session_id === s.id).sort((a, b) => b.created_at.localeCompare(a.created_at))) }; },
    async openCash(amt, notes) { if (openSess()) fail("CAIXA_JA_ABERTO"); S.sessions.push({ id: uid(), opened_at: new Date().toISOString(), opening_amount: amt, notes, status: "aberto" }); tick("cash"); },
    async cashMove(kind, amt, method, desc) { const s = openSess(); if (!s) fail("CAIXA_FECHADO");
      S.movements.push({ id: uid(), session_id: s.id, kind, method, amount: amt, description: desc, created_at: new Date().toISOString() }); tick("cash"); },
    async closeCash(counted, notes) { const s = openSess(); if (!s) fail("CAIXA_FECHADO"); const e = expected(s);
      Object.assign(s, { status: "fechado", closed_at: new Date().toISOString(), expected_cash: e, counted_cash: counted, difference: n2(counted - e), notes: notes || s.notes }); tick("cash");
      return { expected: e, counted, difference: n2(counted - e) }; },
    async cashSessions({ from } = {}) { return clone(S.sessions.filter(s => !from || new Date(s.opened_at) >= from).sort((a, b) => b.opened_at.localeCompare(a.opened_at))
      .map(s => ({ ...s, cash_movements: S.movements.filter(m => m.session_id === s.id) }))); },
    async getUser() { return S.user; },
    async signIn(email) { S.user = { email: email || "dono@brunosalgados.demo" }; },
    async signUp(email) { S.user = { email }; return true; },
    async signOut() { S.user = null; },
    async claimAdmin() { return true; },
    async startOnlinePayment() { throw new Error("Pagamento online ainda não foi ativado pela loja."); },
    subscribeAll() {}
  };
  return api;
}

let API;
/* MODO_APRESENTACAO = true: usa dados de exemplo e o painel abre com um clique (sem e-mail/senha).
   Para ligar o banco de dados real e o login do dono, troque para false e publique de novo. */
const MODO_APRESENTACAO = true;
async function initApi() {
  if (!MODO_APRESENTACAO && window.supabase?.createClient) {
    try {
      const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: true, storageKey: "bs-auth" } });
      const probe = sb.from("store_settings").select("id").eq("id", 1).single();
      const r = await Promise.race([probe, new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), 6000))]);
      if (r.error) throw r.error;
      API = makeSupabaseApi(sb);
      API.subscribeAll();
      return API;
    } catch (e) { console.warn("Supabase indisponível, usando demonstração:", e); }
  }
  API = makeDemoApi();
  return API;
}

/* ================= endereço e distância ================= */
async function fetchJson(url, ms = 8000) {
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), ms);
  try { const r = await fetch(url, { signal: ctl.signal, headers: { Accept: "application/json" } }); if (!r.ok) throw new Error("HTTP " + r.status); return await r.json(); }
  finally { clearTimeout(t); }
}
async function lookupCep(cep) {
  if (API.mode === "demo") return { logradouro: "Rua das Acácias", bairro: "Jardim Primavera", localidade: "Sua cidade", uf: "SP" };
  const d = await fetchJson(`https://viacep.com.br/ws/${onlyDigits(cep)}/json/`);
  if (d.erro) throw new Error("CEP não encontrado.");
  return d;
}
async function geocode({ street, number, city, uf, cep, district }) {
  if (API.mode === "demo") { const h = [...(street + number)].reduce((a, c) => a + c.charCodeAt(0), 0); const km = 1 + (h % 70) / 10;
    return { lat: -23.0 + km / 111, lng: -47.0, simulated: true }; }
  const tries = [
    `street=${encodeURIComponent(`${number} ${street}`)}&city=${encodeURIComponent(city)}&state=${encodeURIComponent(uf)}&postalcode=${onlyDigits(cep)}`,
    `street=${encodeURIComponent(`${number} ${street}`)}&city=${encodeURIComponent(city)}&state=${encodeURIComponent(uf)}`,
    `q=${encodeURIComponent(`${street}, ${number}, ${district || ""}, ${city}, ${uf}`)}`,
    `q=${encodeURIComponent(`${street}, ${city}, ${uf}`)}`
  ];
  for (const qs of tries) {
    const r = await fetchJson(`https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=br&${qs}`);
    if (r?.[0]) return { lat: Number(r[0].lat), lng: Number(r[0].lon) };
  }
  throw new Error("ENDERECO_INVALIDO");
}
async function geocodeFree(text) {
  const r = await fetchJson(`https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=br&q=${encodeURIComponent(text)}`);
  if (!r?.[0]) throw new Error("ENDERECO_INVALIDO");
  return { lat: Number(r[0].lat), lng: Number(r[0].lon), label: r[0].display_name };
}
async function routeKm(from, to) {
  if (API.mode === "demo") return haversine(from.lat, from.lng, to.lat, to.lng) * 1.25;
  try {
    const r = await fetchJson(`https://router.project-osrm.org/route/v1/driving/${from.lng},${from.lat};${to.lng},${to.lat}?overview=false`);
    if (r.routes?.[0]) return r.routes[0].distance / 1000;
  } catch (e) { console.warn("rota indisponível", e); }
  return haversine(from.lat, from.lng, to.lat, to.lng) * 1.3; // aproximação de ruas
}

function openSheet(html, { onClose, cls = "" } = {}) {
  const ov = h(`<div class="overlay"><div class="sheet ${cls}" role="dialog" aria-modal="true">${html}</div></div>`);
  const close = () => { ov.remove(); document.removeEventListener("keydown", key); onClose?.(); };
  const key = e => { if (e.key === "Escape") close(); };
  ov.addEventListener("click", e => { if (e.target === ov) close(); });
  document.addEventListener("keydown", key);
  document.body.appendChild(ov);
  $$("[data-close]", ov).forEach(b => b.addEventListener("click", close));
  const first = $("input,select,textarea", ov); if (first && matchMedia("(min-width:720px)").matches) setTimeout(() => first.focus(), 50);
  return { el: $(".sheet", ov), close };
}
function confirmSheet(title, text, okLabel = "Confirmar", danger) {
  return new Promise(res => {
    let done = false;
    const s = openSheet(`<div class="sheet-head"><h2>${esc(title)}</h2></div><p class="muted">${esc(text)}</p>
      <div class="row" style="justify-content:flex-end"><button class="btn ghost" data-close>Voltar</button><button class="btn ${danger ? "danger" : "primary"}" id="cf-ok">${esc(okLabel)}</button></div>`,
      { onClose: () => { if (!done) res(false); } });
    $("#cf-ok", s.el).onclick = () => { done = true; s.close(); res(true); };
  });
}
async function busy(btn, fn) {
  const old = btn.innerHTML; btn.disabled = true; btn.innerHTML = "Aguarde…";
  try { return await fn(); } catch (e) { console.error(e); toast(errMsg(e), true); } finally { btn.disabled = false; btn.innerHTML = old; }
}

function cartLines() {
  return Object.entries(CL.cart).map(([id, qty]) => ({ p: CL.prods.find(x => x.id === id), qty })).filter(l => l.p && l.p.is_active && l.qty > 0);
}
const cartSubtotal = () => cartLines().reduce((a, l) => a + l.p.price * l.qty, 0);
const cartCount = () => cartLines().reduce((a, l) => a + l.qty, 0);
const avail = p => p.is_active && (!p.track_stock || p.stock > 0);
function setQty(id, q) {
  const p = CL.prods.find(x => x.id === id); if (!p) return;
  if (p.track_stock && q > p.stock) { toast(`Só restam ${p.stock} de ${p.name}`, true); q = p.stock; }
  if (q <= 0) delete CL.cart[id]; else CL.cart[id] = q;
  store.set("cart", CL.cart); CL.quote = CL.quote && { ...CL.quote, stale: true };
  renderClientList(); renderHero(); renderCartBar(); bus.emit("cart");
}

async function startClient() {
  document.title = "Bruno Salgados";
  const root = $("#app");
  root.innerHTML = `<div class="c-wrap" id="c-wrap"><div class="empty">Carregando o cardápio…</div></div><div class="cartbar" id="cartbar" hidden></div>`;
  await loadClientData();
  renderClient();
  if (CL.live) return; CL.live = true;
  try { navigator.storage?.persist?.(); } catch {}
  window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); CL.install = e; renderClient(); });
  bus.on("products", debounce(async () => { const before = cartCount(); await loadClientData(); reconcileCart(before); renderClient(); }, 250));
  bus.on("settings", async () => { CL.s = await API.settings(); renderClient(); });
  bus.on("stories", async () => { CL.stories = (await API.stories()).filter(s => new Date(s.expires_at) > new Date()); renderClient(); });
  const last = store.get("lastOrder"); if (last && Date.now() - last.t < 6 * 36e5) renderClient();
}
function debounce(f, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => f(...a), ms); }; }
async function loadClientData() {
  const [s, cats, prods, stories] = await Promise.all([API.settings(), API.categories(), API.products(), API.stories()]);
  Object.assign(CL, { s, cats, prods: prods.filter(p => p.is_active), stories: stories.filter(x => new Date(x.expires_at) > new Date()) });
}
function reconcileCart() {
  let changed = false;
  for (const [id, q] of Object.entries(CL.cart)) {
    const p = CL.prods.find(x => x.id === id);
    if (!p || !avail(p)) { delete CL.cart[id]; changed = true; toast(`${p?.name || "Um item"} acabou e saiu da sacola`, true); }
    else if (p.track_stock && q > p.stock) { CL.cart[id] = p.stock; changed = true; toast(`${p.name}: só restam ${p.stock}. Ajustamos sua sacola.`, true); }
  }
  if (changed) { store.set("cart", CL.cart); bus.emit("cart"); }
}

function renderHero() {
  const el = $("#hero"); if (!el) return;
  const heroes = heroList(); const p = heroes[CL.hi || 0];
  if (!p) { el.innerHTML = `<div class="glow"></div><div class="copy"><span class="badge">${ICON.trend}Cardápio do dia</span><h1>${splitTitle(CL.s.tagline || CL.s.store_name)}</h1></div>`; return; }
  const q = CL.cart[p.id] || 0;
  el.innerHTML = `<div class="glow"></div><div class="photo">${productThumb(p)}</div>
    <div class="copy"><span class="badge">${ICON.trend}${p.is_combo ? "Ideal para festas" : CL.hi === 0 ? "O mais pedido da casa" : "Saindo quentinho"}</span>
      <h1>${splitTitle(p.name)}</h1>${p.description ? `<p class="desc">${esc(p.description)}</p>` : ""}
      <div class="buy"><span class="price num">${money(p.price)}</span>
        ${q ? `<div class="stepper" style="height:54px"><button data-hd aria-label="Tirar um" style="width:50px;height:54px">−</button><span class="num">${q}</span><button data-hi aria-label="Pôr mais um" style="width:50px;height:54px">+</button></div>`
          : `<button class="btn-add" data-hadd ${!CL.s.is_open ? "disabled" : ""}>${ICON.plus}${CL.s.is_open ? "Adicionar" : "Loja fechada"}</button>`}</div></div>
    ${heroes.length > 1 ? `<div class="dots" role="tablist" aria-label="Destaques">${heroes.map((h, i) => `<button role="tab" aria-label="${esc(h.name)}" aria-current="${i === (CL.hi || 0)}" data-dot="${i}"></button>`).join("")}</div>` : ""}`;
  $("[data-hadd]", el) && ($("[data-hadd]", el).onclick = () => { setQty(p.id, 1); renderHero(); });
  $("[data-hi]", el) && ($("[data-hi]", el).onclick = () => { setQty(p.id, q + 1); renderHero(); });
  $("[data-hd]", el) && ($("[data-hd]", el).onclick = () => { setQty(p.id, q - 1); renderHero(); });
  $$("[data-dot]", el).forEach(b => b.onclick = () => { CL.hi = +b.dataset.dot; renderHero(); });
}

function renderClientList() {
  const el = $("#c-list"); if (!el) return;
  const q = (CL.q || "").trim().toLowerCase();
  const match = p => !q || p.name.toLowerCase().includes(q) || (p.description || "").toLowerCase().includes(q);
  const groups = CL.cats.map(c => ({ c, items: CL.prods.filter(p => p.category_id === c.id && match(p)) })).filter(g => g.items.length);
  const loose = CL.prods.filter(p => !CL.cats.some(c => c.id === p.category_id) && match(p));
  if (loose.length) groups.push({ c: { id: "outros", name: "Outros" }, items: loose });
  CL.open ||= {};
  if (!groups.length) { el.innerHTML = q ? `<div class="empty-search"><h3>Nada com “${esc(CL.q)}”</h3><p>Tente outro nome, como coxinha ou kibe.</p></div>`
    : `<div class="empty-search"><h3>Cardápio em preparo</h3><p>Os salgados aparecem aqui assim que a loja cadastrar.</p></div>`; return; }
  const LIMIT = 4;
  el.innerHTML = groups.map(({ c, items }) => { const all = q || CL.open[c.id] || items.length <= LIMIT; const shown = all ? items : items.slice(0, LIMIT);
    return `<section class="sec" id="sec-${c.id}"><div class="sec-h"><h2>${esc(c.name)}</h2>${items.length > LIMIT && !q
      ? `<button class="see-all" data-open="${c.id}">${CL.open[c.id] ? "Ver menos" : `Ver todos (${items.length})`}${ICON.arrow}</button>` : ""}</div>
    <div class="plist">${shown.map(productCard).join("")}</div></section>`; }).join("");
  $$("[data-inc]", el).forEach(b => b.onclick = () => setQty(b.dataset.inc, (CL.cart[b.dataset.inc] || 0) + 1));
  $$("[data-dec]", el).forEach(b => b.onclick = () => setQty(b.dataset.dec, (CL.cart[b.dataset.dec] || 0) - 1));
  $$("[data-open]", el).forEach(b => b.onclick = () => { CL.open[b.dataset.open] = !CL.open[b.dataset.open]; renderClientList(); });
}
function productCard(p) {
  const q = CL.cart[p.id] || 0, ok = avail(p), low = p.track_stock && p.stock > 0 && p.stock <= p.low_stock_alert;
  const tag = !ok ? `<span class="tag-chip bad">Esgotado</span>` : low ? `<span class="tag-chip warn">Restam ${p.stock}</span>` : p.is_featured ? `<span class="tag-chip">Destaque</span>` : "";
  return `<article class="pcard ${ok ? "" : "off"} ${tag ? "has-tag" : ""}">
    <div class="pimg">${productThumb(p)}</div>
    <div class="info"><h3>${esc(p.name)}</h3>
      ${p.description ? `<p class="desc">${esc(p.description)}</p>` : ""}
      ${p.is_combo && p.combo_items ? `<p class="incl">Inclui: ${esc(p.combo_items)}</p>` : ""}
      <div class="foot"><span class="price num">${money(p.price)} <span class="unit">/ ${esc(p.unit_label)}</span></span>
        ${!ok || !CL.s.is_open ? "" : q

    ${tag ? `<div class="tag">${tag}</div>` : ""}

function renderCartBar() {

  st.pay = CL.me.pay && pays.some(p => p[0] === CL.me.pay) ? CL.me.pay : pays[0]?.[0];

    <div class="box" id="ck-items"></div>

      <div class="field"><label for="ck-phone">WhatsApp</label><input class="input" id="ck-phone" inputmode="tel" autocomplete="tel" placeholder="(00) 00000-0000" value="${esc(CL.me.phone || "")}"></div></div>
    </div>
    ${CL.me.name ? `<p class="saved-note">${ICON.check}<span>Seus dados ficam salvos neste celular para a próxima compra.</span><button id="ck-forget">Apagar meus dados</button></p>` : ""}

  async function autoQuote() {

    const km = await routeKm({ lat: s.lat, lng: s.lng }, geo);
    const q = await API.quote(geo.lat, geo.lng, n2(km), cartSubtotal());

      : st.pay === "cartao" ? `<div class="seg" role="group" aria-label="Tipo de cartão"><button data-card="cartao_debito" aria-pressed="${st.card !== "cartao_credito"}">Débito</button><button data-card="cartao_credito" aria-pressed="${st.card === "cartao_credito"}">Crédito</button></div>` : "";
    $$("[data-card]", el).forEach(b => b.onclick = () => { st.card = b.dataset.card; drawPay(); });
  }
  function drawSum() {
    const sub = cartSubtotal(); const q = CL.quote; const ent = st.mode === "entrega";
    const fee = ent && q?.ok ? q.fee : 0;
    const minOk = !ent || sub >= Number(s.delivery_min_order || 0);

      <div class="sumrow total"><span>Total</span><span class="num">${money(sub + fee)}</span></div>`;

    const method = st.pay === "cartao" ? (st.card || "cartao_debito") : st.pay;

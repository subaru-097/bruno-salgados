    if (ent && CL.quote?.stale) await calcQuote();
    CL.me = { name, phone, mode: st.mode, pay: st.pay }; store.set("me", CL.me);
    const payload = { channel: "app", customer_name: name, customer_phone: phone, fulfillment: st.mode, payment_method: method,
      change_for: method === "dinheiro" ? parseMoney($("#ck-troco", el)?.value) || null : null, notes: $("#ck-notes", el).value.trim() || null,
      items: cartLines().map(l => ({ product_id: l.p.id, qty: l.qty })) };
    if (ent) Object.assign(payload, { address: `${a.street}, ${a.num} · ${a.district} · ${a.city}${a.uf ? "/" + a.uf : ""} · CEP ${a.cep}`, address_ref: a.ref,
      lat: CL.quote.lat, lng: CL.quote.lng, distance_km: CL.quote.route_km });
    const r = await API.placeOrder(payload);
    const optin = $("#ck-optin", el)?.checked ?? false; CL.me.optin = optin; store.set("me", CL.me);
    try { await API.setOptin(r.id, phone, optin); } catch {}
    CL.cart = {}; store.set("cart", {}); CL.quote = null;
    store.set("lastOrder", { id: r.id, code: r.code, t: Date.now() });
    sh.close(); renderClient();
    if (method === "mercadopago") { try { location.href = await API.startOnlinePayment(r.id); return; } catch (err) { toast(err.message + " Pague na entrega.", true); } }
    openTracking(r.id, true);
  });
  ["ck-name", "ck-phone"].forEach(id => $("#" + id, el).addEventListener("change", () => { CL.me.name = $("#ck-name", el).value.trim(); CL.me.phone = $("#ck-phone", el).value.trim(); store.set("me", CL.me); }));
  drawItems(); drawMode(); drawPay();
}

/* ---------- acompanhar pedido ---------- */
function openTracking(id, fresh) {
  let timer;
  const sh = openSheet(`<div class="sheet-head"><h2>Seu pedido</h2><button class="btn icon ghost" data-close aria-label="Fechar">✕</button></div><div id="tr-body"><div class="empty">Carregando…</div></div>`,
    { onClose: () => clearInterval(timer) });
  async function load() {
    const o = await API.orderPublic(id).catch(() => null); const body = $("#tr-body", sh.el); if (!body) return;
    if (!o) { body.innerHTML = `<div class="empty">Não encontramos esse pedido.</div>`; return; }
    const s = CL.s, ent = o.fulfillment === "entrega";
    const steps = [["novo", "Pedido enviado", o.status === "novo" ? "Aguardando a loja aceitar" : "A loja aceitou seu pedido"], ["preparando", "Aceito e em preparo", "Seus salgados estão na fritura"],
      ent ? ["saiu", "Saiu para entrega", "O entregador está a caminho"] : ["pronto", "Pronto para retirar", s.address || ""], ["entregue", ent ? "Entregue" : "Retirado", "Bom apetite!"]];
    const order = ["novo", "preparando", "pronto", "saiu", "entregue"]; const idx = order.indexOf(o.status);
    const stepIdx = k => order.indexOf(k);
    const txt = `Olá! Fiz o pedido #${o.code} pelo app:\n` + o.items.map(i => `${i.qty}x ${i.name}`).join("\n") + `\nTotal: ${money(o.total)}`;
    body.innerHTML = `<div class="row" style="justify-content:space-between"><span class="ord-code num" style="font-size:1.6rem">#${o.code}</span>
      <span class="chip ${o.status === "cancelado" ? "bad" : o.status === "entregue" ? "good" : "accent"}">${STATUS_LABEL[o.status]}</span></div>
      ${fresh ? `<p class="muted">Pedido enviado. Deixe esta tela aberta para acompanhar; ela atualiza sozinha.</p>` : ""}
      ${o.status === "cancelado" ? `<div class="closed-note">Este pedido foi cancelado pela loja. Fale com a gente se tiver dúvidas.</div>` : `<div class="track">${steps.map(([k, t, d]) => {
        const si = stepIdx(k), done = idx > si || (k === "entregue" && o.status === "entregue"), now = o.status === k || (k === "pronto" && o.status === "saiu" && !ent);
        return `<div class="tstep ${done ? "done" : ""} ${now ? "now" : ""}"><span class="b">${done ? ICON.check : ""}</span><div><div style="font-weight:600">${t}</div><div class="muted" style="font-size:.85rem">${esc(d)}</div></div></div>`; }).join("")}</div>`}
      ${o.payment_method === "pix" && o.payment_status === "pendente" && s.pix_key ? `<div class="box"><span class="lbl">Pague com Pix</span><div class="num" style="font-size:1.4rem;font-weight:800">${money(o.total)}</div>
        <div class="row" style="justify-content:space-between"><code style="font-size:.95rem;word-break:break-all;user-select:all">${esc(s.pix_key)}</code><button class="btn sm" id="tr-pix">Copiar chave</button></div>
        <span class="faint" style="font-size:.82rem">${esc(s.pix_name || "")} · Envie o comprovante pelo WhatsApp da loja</span></div>` : ""}
      <div class="box">${o.items.map(i => `<div class="sumrow"><span>${i.qty}× ${esc(i.name)}</span><span class="num">${money(i.total)}</span></div>`).join("")}
        ${Number(o.delivery_fee) ? `<div class="sumrow"><span class="muted">Entrega</span><span class="num">${money(o.delivery_fee)}</span></div>` : ""}
        <div class="sumrow total"><span>Total</span><span class="num">${money(o.total)}</span></div><span class="faint" style="font-size:.82rem">${METHOD_LABEL[o.payment_method]} · ${o.payment_status === "pago" ? "pago" : "a pagar"}</span></div>
      ${s.whatsapp ? `<a class="btn block" href="${waLink(s.whatsapp, txt)}" target="_blank" rel="noopener">Falar com a loja no WhatsApp</a>
        <p class="faint" style="font-size:.8rem;text-align:center">WhatsApp da loja: <span style="user-select:all">${esc(s.whatsapp)}</span></p>` : ""}`;
    $("#tr-pix", body) && ($("#tr-pix", body).onclick = () => copyText(s.pix_key));
    if (["entregue", "cancelado"].includes(o.status)) clearInterval(timer);
  }
  load(); timer = setInterval(load, 8000);
}

/* ---------- stories ---------- */
function openStories(start) {
  let i = start, t0, raf, paused = false;
  const list = CL.stories;
  const v = h(`<div class="sv" role="dialog" aria-label="Stories"><div class="bars">${list.map(() => "<i><b></b></i>").join("")}</div><div class="sv-media"></div><div class="cap"></div>
    <button class="nav" style="left:0" aria-label="Anterior"></button><button class="nav" style="right:0" aria-label="Próximo"></button><button class="x" aria-label="Fechar">✕</button></div>`);
  document.body.appendChild(v);
  const close = () => { cancelAnimationFrame(raf); v.remove(); document.removeEventListener("keydown", key); renderClient(); };
  const key = e => { if (e.key === "Escape") close(); if (e.key === "ArrowRight") go(1); if (e.key === "ArrowLeft") go(-1); };
  document.addEventListener("keydown", key);
  function show() {
    const st = list[i]; const isVid = st.media_type === "video";
    $(".sv-media", v).innerHTML = isVid ? `<video src="${esc(st.image_url)}" autoplay muted playsinline></video>` : `<img src="${esc(st.image_url)}" alt="">`;
    CL.vid = isVid ? $("video", v) : null; if (CL.vid) CL.vid.onended = () => go(1);
    $(".cap", v).textContent = st.caption || "";
    const seen = store.get("seenStories", []); if (!seen.includes(st.id)) store.set("seenStories", [...seen, st.id].slice(-50));
    $$(".bars b", v).forEach((b, k) => b.style.width = k < i ? "100%" : "0");
    t0 = performance.now(); cancelAnimationFrame(raf); raf = requestAnimationFrame(step);
  }
  function step(t) { if (paused) { t0 += 16; raf = requestAnimationFrame(step); return; }
    const p = CL.vid ? (CL.vid.duration ? Math.min(1, CL.vid.currentTime / CL.vid.duration) : 0) : Math.min(1, (t - t0) / 5000);
    if (CL.vid) { $$(".bars b", v)[i].style.width = p * 100 + "%"; raf = requestAnimationFrame(step); return; } $$(".bars b", v)[i].style.width = p * 100 + "%"; if (p >= 1) go(1); else raf = requestAnimationFrame(step); }
  function go(d) { i += d; if (i < 0) i = 0; if (i >= list.length) return close(); show(); }
  $$(".nav", v)[0].onclick = () => go(-1); $$(".nav", v)[1].onclick = () => go(1); $(".x", v).onclick = close;
  v.addEventListener("pointerdown", () => paused = true); v.addEventListener("pointerup", () => paused = false);
  show();
}

  </section>`;
  $$("[data-go]", el).forEach(b => b.onclick = () => go(b.dataset.go));

async function saleModal() {
  const [prods, custs, sess] = await Promise.all([API.products(), API.customers(), API.cashCurrent()]);
  const act = prods.filter(p => p.is_active);
  const S = { items: [], step: "prod", pays: [], cust: null, disc: 0, method: null, q: "", sel: 0 };
  const sh = openSheet(`<div class="sheet-head"><div><h2>Nova venda</h2><p class="faint" id="sm-sub" style="margin-top:2px">1. Escolha os produtos</p></div><button class="btn icon ghost" data-close aria-label="Fechar">✕</button></div>
    <div class="sale"><div class="sale-left" id="sm-left"></div><aside class="sale-right" id="sm-right"></aside></div><div class="sm-bar" id="sm-bar" hidden></div>`, { cls: "wide" });
  const el = sh.el;
  const line = id => act.find(p => p.id === id);
  const lines = () => S.items.map(i => ({ ...i, p: line(i.id) }));
  const sub = () => sumBy(lines(), l => l.p.price * l.qty), total = () => n2(Math.max(0, sub() - S.disc));
  const paid = () => n2(sumBy(S.pays, x => x.amount)), remaining = () => n2(total() - paid());
  const change = () => sumBy(S.pays, x => x.change || 0);
  const inCart = id => S.items.find(i => i.id === id)?.qty || 0;
  const add = (p, n = 1) => { if (!p) return; if (p.track_stock && inCart(p.id) + n > p.stock) { toast(`${p.name}: só ${p.stock - inCart(p.id)} no estoque`, true); return; }
    const it = S.items.find(i => i.id === p.id); if (it) it.qty += n; else S.items.push({ id: p.id, qty: n }); drawRight(); drawList(); };

  function drawLeft() {
    $("#sm-sub", el).textContent = S.step === "prod" ? "1. Escolha os produtos" : S.step === "pay" ? "2. Forma de pagamento" : "Venda concluída";
    const L = $("#sm-left", el);
    if (S.step === "prod") {
      L.innerHTML = `<label class="sm-search">${ICON.search}<input id="sm-q" placeholder="Digite o código ou o nome do produto" autocomplete="off" value="${esc(S.q)}" aria-label="Código ou nome do produto"></label>
        <div class="sm-list" id="sm-list"></div>`;
      const q = $("#sm-q", L);
      q.oninput = () => { S.q = q.value; S.sel = 0; drawList(); };
      q.onkeydown = e => { const f = filtered();
        if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); if (!f.length) return; S.sel = (S.sel + (e.key === "ArrowDown" ? 1 : -1) + f.length) % f.length; drawList(); }
        if (e.key === "Enter") { e.preventDefault(); const p = f[S.sel]; if (p) { add(p); q.value = S.q = ""; S.sel = 0; drawList(); } } };
      drawList(); if (matchMedia("(min-width:720px)").matches) setTimeout(() => q.focus(), 60);
    } else if (S.step === "pay") drawPay();
  }
  const filtered = () => { const t = S.q.trim().toLowerCase(); if (!t) return act;
    const ex = act.filter(p => (p.code || "").toLowerCase() === t); return ex.concat(act.filter(p => !ex.includes(p) && ((p.code || "").toLowerCase().startsWith(t) || p.name.toLowerCase().includes(t)))); };
  function drawList() {
    const box = $("#sm-list", el); if (!box) return; const f = filtered();
    box.innerHTML = f.length ? f.map((p, i) => { const left = p.track_stock ? p.stock - inCart(p.id) : null, n = inCart(p.id);
      return `<button class="sm-item" data-add="${p.id}" aria-selected="${i === S.sel && !!S.q}" ${left !== null && left <= 0 ? "disabled" : ""}>${productThumb(p)}
        <span class="nm"><b>${esc(p.name)}</b><span>${p.code ? "Cód. " + esc(p.code) + " · " : ""}${left === null ? "sem controle de estoque" : left <= 0 ? "sem estoque" : left + " em estoque"}</span></span>
        <span class="pr num">${money(p.price)}</span><span class="plus">${n ? `<b class="num">${n}</b>` : ICON.plus}</span></button>`; }).join("")
      : `<p class="empty-row">Nenhum produto com esse código ou nome.</p>`;
    $$("[data-add]", box).forEach(b => b.onclick = () => add(line(b.dataset.add)));
  }
  function drawPay() {
    const L = $("#sm-left", el), rem = remaining();
    const M = [["dinheiro", "Dinheiro", ICON.cash], ["pix", "Pix", ICON.bolt], ["cartao_debito", "Débito", ICON.receipt], ["cartao_credito", "Crédito", ICON.receipt], ["fiado", "Fiado", ICON.users]];
    L.innerHTML = `<button class="link-btn" id="sm-back" style="align-self:flex-start">← Voltar aos produtos</button>
      ${rem > 0 ? `<div class="pay-need"><span>${S.pays.length ? "Falta pagar" : "Total a pagar"}</span><b class="num">${money(rem)}</b></div>
        <div class="pay-methods">${M.map(([k, l, ic]) => `<button data-m="${k}" aria-pressed="${S.method === k}">${ic}${l}</button>`).join("")}</div>
        <div id="sm-form"></div>
        ${S.pays.length ? "" : `<p class="faint" style="font-size:.85rem">Pode dividir: por exemplo, uma parte no Pix e o resto em dinheiro. Basta lançar o primeiro valor e escolher a próxima forma.</p>`}`
      : `<div class="pay-done">${ICON.checkBig}<b>Pagamento completo</b>${change() > 0 ? `<span>Troco: <b class="num">${money(change())}</b></span>` : ""}</div>`}`;
    $("#sm-back", L).onclick = () => { S.step = "prod"; S.pays = []; S.method = null; drawLeft(); drawRight(); };
    $$("[data-m]", L).forEach(b => b.onclick = () => { S.method = b.dataset.m; drawPay(); drawRight(); });
    drawForm();
  }
  function drawForm() {
    const F = $("#sm-form", el); if (!F || !S.method) return; const rem = remaining(), m = S.method;
    if (m === "dinheiro") {
      F.innerHTML = `<div class="field"><label for="sm-v">Valor recebido em dinheiro</label><input class="input num big-in" id="sm-v" inputmode="decimal" placeholder="${moneyInput(rem)}"></div>
        <div id="sm-calc"></div><button class="btn primary block" id="sm-ok">Confirmar dinheiro</button>`;
      const v = $("#sm-v", F), calc = () => { const r = v.value.trim() ? parseMoney(v.value) : rem;
        $("#sm-calc", F).innerHTML = r < rem ? `<div class="diff bad">Faltando ${money(rem - r)}. Complete com outra forma depois.</div>` : r > rem ? `<div class="diff ok">Troco ${money(r - rem)}</div>` : `<div class="diff ok">Valor certo, sem troco</div>`; };
      v.oninput = calc; calc(); setTimeout(() => v.focus(), 30);
      const ok = () => { const r = v.value.trim() ? parseMoney(v.value) : rem; if (r <= 0) return toast("Digite o valor recebido.", true);
        const applied = n2(Math.min(r, rem)); S.pays.push({ method: "dinheiro", amount: applied, received: r, change: n2(Math.max(0, r - rem)) }); S.method = null; drawPay(); drawRight(); };
      $("#sm-ok", F).onclick = ok; v.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); ok(); } };
    } else if (m === "fiado") {
      F.innerHTML = `${customerPicker(custs, null, S.cust?.id)}<div class="field"><label for="sm-v">Valor no fiado</label><input class="input num" id="sm-v" inputmode="decimal" value="${moneyInput(rem)}"></div>
        <div id="sm-lim"></div><button class="btn primary block" id="sm-ok">OK, lançar na conta do cliente</button>`;
      $("label[for=cp-q]", F).textContent = "Nome do cliente";
      bindPicker(F, custs, c => { S.cust = c; const v = parseMoney($("#sm-v", F).value);
        $("#sm-lim", F).innerHTML = c.credit_limit && Number(c.balance) + v > Number(c.credit_limit) ? `<div class="diff bad">Passa do limite: já deve ${money(c.balance)}, limite ${money(c.credit_limit)}</div>` : ""; });
      setTimeout(() => $("#cp-q", F).focus(), 30);
      $("#sm-ok", F).onclick = () => { if (!S.cust) return toast("Escolha o cliente do fiado.", true); const v = n2(Math.min(parseMoney($("#sm-v", F).value), rem));
        if (v <= 0) return toast("Digite o valor.", true); S.pays.push({ method: "fiado", amount: v }); S.method = null; drawPay(); drawRight(); };
    } else {
      F.innerHTML = `<div class="field"><label for="sm-v">Valor no ${METHOD_LABEL[m]}</label><input class="input num big-in" id="sm-v" inputmode="decimal" value="${moneyInput(rem)}"></div>
        <button class="btn primary block" id="sm-ok">Confirmar ${METHOD_LABEL[m]}</button>`;
      const v = $("#sm-v", F); setTimeout(() => { v.focus(); v.select(); }, 30);
      const ok = () => { const a = n2(parseMoney(v.value)); if (a <= 0) return toast("Digite o valor.", true); if (a > rem + .009) return toast(`O valor passa do que falta (${money(rem)}).`, true);
        S.pays.push({ method: m, amount: a }); S.method = null; drawPay(); drawRight(); };
      $("#sm-ok", F).onclick = ok; v.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); ok(); } };
    }
  }
  function drawRight() {
    const R = $("#sm-right", el), ls = lines(), rem = remaining(), editing = S.step === "prod";
    const needCash = S.pays.some(x => x.method !== "fiado") && !sess;
    R.innerHTML = `<h3>Resumo da venda</h3>
      <div class="sm-cart">${ls.length ? ls.map(l => `<div class="sm-line"><div class="grow"><b>${esc(l.p.name)}</b><span class="faint num">${money(l.p.price)} cada</span></div>
        ${editing ? `<span class="qty"><button data-m="${l.id}" aria-label="Menos">−</button><b class="num">${l.qty}</b><button data-pl="${l.id}" aria-label="Mais">+</button></span>` : `<span class="faint num">${l.qty}×</span>`}
        <b class="num">${money(l.p.price * l.qty)}</b></div>`).join("") : `<p class="faint" style="padding:18px 0;text-align:center">Nenhum produto ainda.<br>Toque num produto para adicionar.</p>`}</div>
      ${ls.length ? `${editing ? `<div class="field"><label for="sm-disc">Desconto (R$)</label><input class="input num" id="sm-disc" inputmode="decimal" value="${S.disc ? moneyInput(S.disc) : ""}" placeholder="0,00"></div>` : S.disc ? `<div class="calc-row"><span>Desconto</span><b class="num">−${money(S.disc)}</b></div>` : ""}
        <div class="total-line"><span class="muted">Total</span><b>${money(total())}</b></div>
        ${S.pays.length ? `<div class="sm-pays">${S.pays.map((x, i) => `<div class="calc-row"><span>${METHOD_LABEL[x.method]}${x.method === "fiado" && S.cust ? " · " + esc(S.cust.name) : ""}${x.change ? ` <span class="faint">(recebido ${money(x.received)})</span>` : ""}</span><span class="row" style="gap:6px;flex-wrap:nowrap"><b class="num">${money(x.amount)}</b><button class="x-btn" data-rm="${i}" aria-label="Remover pagamento">✕</button></span></div>`).join("")}
          ${rem > 0 ? `<div class="calc-row" style="color:var(--bad)"><span style="color:inherit">Falta</span><b class="num">${money(rem)}</b></div>` : change() > 0 ? `<div class="calc-row" style="color:var(--good)"><span style="color:inherit">Troco</span><b class="num">${money(change())}</b></div>` : ""}</div>` : ""}
        ${editing ? `<button class="btn primary block big-btn" id="sm-next">Ir para pagamento ${ICON.arrow}</button>`
          : `<button class="btn primary block big-btn" id="sm-fin" ${rem > 0 || needCash ? "disabled" : ""}>${needCash ? "Abra o caixa para receber" : rem > 0 ? "Falta " + money(rem) : "Finalizar venda"}</button>`}
        <button class="btn ghost block" id="sm-later">Salvar para pagar depois</button>` : ""}`;
    const bar = $("#sm-bar", el), n = sumBy(ls, l => l.qty);
    bar.hidden = !ls.length || S.step === "done" || (S.step === "pay" && !!S.method);
    bar.innerHTML = editing ? `<span><b class="num">${money(total())}</b><span class="faint"> · ${n} ${n === 1 ? "item" : "itens"}</span></span><button class="btn primary" id="smb-go">Pagamento ${ICON.arrow}</button>`
      : rem > 0 ? `<span><span class="faint">Falta </span><b class="num" style="color:var(--bad)">${money(rem)}</b></span><button class="btn ghost" id="smb-sum">Ver resumo</button>`
      : `<span><b class="num">${money(total())}</b>${change() > 0 ? `<span class="faint"> · troco ${money(change())}</span>` : ""}</span><button class="btn primary" id="smb-fin" ${needCash ? "disabled" : ""}>Finalizar venda</button>`;
    $("#smb-go", bar) && ($("#smb-go", bar).onclick = () => { S.step = "pay"; drawLeft(); drawRight(); el.scrollTo?.(0, 0); });
    $("#smb-sum", bar) && ($("#smb-sum", bar).onclick = () => R.scrollIntoView({ behavior: "smooth" }));
    $("#smb-fin", bar) && ($("#smb-fin", bar).onclick = e => finish(true, e.currentTarget));
    $$("[data-pl]", R).forEach(b => b.onclick = () => add(line(b.dataset.pl)));
    $$("[data-m]", R).forEach(b => b.onclick = () => { const it = S.items.find(i => i.id === b.dataset.m); it.qty--; if (it.qty <= 0) S.items = S.items.filter(i => i !== it); drawRight(); drawList(); });
    $$("[data-rm]", R).forEach(b => b.onclick = () => { S.pays.splice(+b.dataset.rm, 1); if (!S.pays.some(x => x.method === "fiado")) S.cust = S.cust; drawPay(); drawRight(); });
    $("#sm-disc", R) && ($("#sm-disc", R).onchange = e => { S.disc = Math.min(sub(), parseMoney(e.target.value)); drawRight(); });
    $("#sm-next", R) && ($("#sm-next", R).onclick = () => { S.step = "pay"; drawLeft(); drawRight(); });
    $("#sm-fin", R) && ($("#sm-fin", R).onclick = e => finish(true, e.currentTarget));
    $("#sm-later", R) && ($("#sm-later", R).onclick = e => finish(false, e.currentTarget));
  }
  const finish = (payNow, btn) => busy(btn, async () => {
    const fi = S.pays.find(x => x.method === "fiado");
    if (payNow && fi && S.cust?.credit_limit && Number(S.cust.balance) + fi.amount > Number(S.cust.credit_limit)) {
      if (!(await confirmSheet("Passa do limite de fiado", `${S.cust.name} já deve ${money(S.cust.balance)} e o limite é ${money(S.cust.credit_limit)}. Lançar mesmo assim?`, "Lançar no fiado"))) return; }
    const pays = payNow ? S.pays.map(x => ({ method: x.method, amount: x.amount })) : [];
    const r = await API.placeOrder({ channel: "balcao", customer_name: S.cust?.name || "Balcão", customer_id: S.cust?.id || null, customer_phone: S.cust?.phone || null,
      payment_method: pays[0]?.method || "dinheiro", payments: payNow ? pays : undefined, discount: S.disc, pay_now: payNow, items: S.items.map(i => ({ product_id: i.id, qty: i.qty })) });
    const ch = change();
    S.step = "done";
    $("#sm-sub", el).textContent = "Venda concluída";
    $("#sm-bar", el).hidden = true;
    $(".sale", el).innerHTML = `<div class="sale-ok">${ICON.checkBig}<h3>${payNow ? `Venda #${r.code} registrada` : `Pedido #${r.code} salvo para pagar depois`}</h3>
      <p class="muted">${money(r.total)}${payNow ? " · " + pays.map(x => METHOD_LABEL[x.method]).join(" + ") : ""}</p>${payNow && ch > 0 ? `<div class="diff ok" style="font-size:1.3rem">Troco: ${money(ch)}</div>` : ""}

    $("#sm-again", el).onclick = () => { sh.close(); saleModal(); };
    $$("[data-close]", el).forEach(b => b.onclick = () => sh.close());
    if (AD.view === "vendas") renderView();
  });
  drawLeft(); drawRight();
}

function todaySales(orders) {
  let f = "todas";
  const sh = openSheet(`<div class="sheet-head"><div><h2>Vendas de hoje</h2><p class="faint" style="margin-top:2px">${fmtDateLong(new Date())}</p></div><button class="btn icon ghost" data-close aria-label="Fechar">✕</button></div>
    <div id="ts-body"></div>`, { cls: "wide" });
  const draw = () => {
    const ok = orders.filter(validOrder), rev = sumBy(ok, orderRevenue);
    const tests = { todas: () => true, balcao: o => o.fulfillment === "balcao", retirada: o => o.fulfillment === "retirada", entrega: o => o.fulfillment === "entrega", areceber: o => o.payment_status === "pendente" && validOrder(o) };
    const list = orders.filter(tests[f]);
    const pm = {}; ok.filter(o => ["pago", "fiado"].includes(o.payment_status)).forEach(o => payParts(o).forEach(x => pm[x.method] = (pm[x.method] || 0) + Number(x.amount)));
    $("#ts-body", sh.el).innerHTML = `<div class="mini-stats"><div><span>Total vendido</span><b>${money(rev)}</b></div><div><span>Vendas</span><b class="num">${ok.length}</b></div>
        ${Object.entries(pm).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([k, v]) => `<div><span>${METHOD_LABEL[k]}</span><b>${money(v)}</b></div>`).join("")}</div>
      <div class="pills">${[["todas", "Todas"], ["balcao", "Balcão"], ["retirada", "Retirada"], ["entrega", "Entrega"], ["areceber", "A receber"]].map(([k, l]) => `<button data-f="${k}" aria-pressed="${f === k}">${l}<span class="n num">${orders.filter(tests[k]).length}</span></button>`).join("")}</div>
      <div class="ts-list">${list.length ? list.map(o => `<button class="ts-row ${o.status === "cancelado" ? "canc" : ""}" data-o="${o.id}">
          <span class="t num">${fmtTime(o.created_at)}</span>
          <span class="who2"><b>${esc(o.customer_name)} <span class="faint num" style="font-weight:500">· nº ${o.code}</span></b><span class="faint">${(o.order_items || []).map(i => `${i.qty}× ${esc(i.name)}`).join(", ")}</span></span>
          ${typeChip(o)}<span class="pm">${payText(o)}<br>${payPill(o)}</span><b class="num val">${money(o.total)}</b></button>`).join("")
        : `<p class="empty-row">Nenhuma venda nesse filtro.</p>`}</div>`;
    $$("[data-f]", sh.el).forEach(b => b.onclick = () => { f = b.dataset.f; draw(); });
    $$("[data-o]", sh.el).forEach(b => b.onclick = () => orderDetail(orders.find(o => o.id === b.dataset.o)));
  };
  draw();
}

/* ================= PEDIDOS ================= */
async function vPedidos(el) {
  const today = startOfDay(new Date());
  const orders = await API.orders({ from: new Date(today - 2 * 864e5) });
  const live = orders.filter(o => ["novo", "preparando", "pronto", "saiu"].includes(o.status));
  const done = orders.filter(o => ["entregue", "cancelado"].includes(o.status) && new Date(o.created_at) >= today && o.channel === "app");
  const S = [
    ["novo", "Aguardando aceite", ICON.bell, live.filter(o => o.status === "novo"), "hot"],
    ["preparando", "Em preparo", ICON.flame, live.filter(o => o.status === "preparando"), ""],
    ["pronto", "Pronto para retirar", ICON.bag, live.filter(o => o.status === "pronto"), ""],
    ["saiu", "Saiu para entrega", ICON.bolt, live.filter(o => o.status === "saiu"), ""],
    ["fim", "Concluídos hoje", ICON.check, done, "muted-sec"],
  ].filter(x => x[3].length);
  const card = o => {
    const nx = nextStatus(o), mins = Math.max(1, Math.round((Date.now() - new Date(o.created_at)) / 6e4));
    const ago = mins < 60 ? `há ${mins} min` : `há ${Math.floor(mins / 60)} h`;
    const label = { preparando: "Aceitar", saiu: "Saiu para entrega", pronto: "Pronto", entregue: "Concluir" }[nx?.[0]];
    return `<article class="aw ${o.status === "cancelado" ? "canc" : ""}">
      <div class="aw-h"><div><b>Nº ${o.code} · ${esc(o.customer_name)}</b><span class="faint">${fmtTime(o.created_at)} · ${ago}</span></div>${typeChip(o)}</div>
      <div class="aw-items">${(o.order_items || []).map(i => `<span>${i.qty}× ${esc(i.name)}</span>`).join("")}</div>
      ${o.fulfillment === "entrega" && o.address ? `<div class="aw-addr">${ICON.pin}<span>${esc(o.address)}</span></div>` : ""}
      ${o.notes ? `<div class="aw-note">${esc(o.notes)}</div>` : ""}
      <div class="aw-f"><span><b class="num">${money(o.total)}</b><span class="faint"> · ${payText(o)}</span> ${o.payment_status !== "pendente" ? payPill(o) : ""}</span>
        <span class="row" style="gap:8px"><button class="btn sm ghost" data-see="${o.id}">Ver</button>${o.status === "cancelado" ? `<span class="st cancelado">Cancelado</span>` : nx ? `<button class="btn sm primary" data-adv="${o.id}">${label}</button>` : ""}</span></div>
    </article>`; };
  el.innerHTML = head("Pedidos", "Atualiza sozinho quando chega pedido novo", API.mode === "demo" ? `<button class="btn ghost" id="o-sim">Simular pedido do app</button>` : "") +

function barChart(canvas, labels, data, { money: isMoney = true, highlightLast = true } = {}) {
  if (!window.Chart) { canvas.parentElement.innerHTML = `<p class="muted">Gráfico indisponível sem conexão.</p>`; return; }
  const acc = cssVar("--accent"), soft = cssVar("--accent-soft"), fg2 = cssVar("--fg-2"), line = cssVar("--line");
  const c = new Chart(canvas, { type: "bar", data: { labels, datasets: [{ data, backgroundColor: data.map((_, i) => highlightLast && i === data.length - 1 ? acc : color_mix(acc, .55)),
      hoverBackgroundColor: acc, borderRadius: 4, borderSkipped: "bottom", maxBarThickness: 34, categoryPercentage: .8, barPercentage: .9 }] },
    options: { responsive: true, maintainAspectRatio: false, animation: { duration: 250 },
      plugins: { legend: { display: false }, tooltip: { backgroundColor: cssVar("--fg"), titleColor: cssVar("--bg"), bodyColor: cssVar("--bg"), displayColors: false, padding: 10,
        callbacks: { label: x => isMoney ? money(x.raw) : `${x.raw}` } } },
      scales: { x: { grid: { display: false }, ticks: { color: fg2, maxRotation: 0, autoSkip: true, autoSkipPadding: 8, font: { size: 11 } }, border: { color: line } },
        y: { beginAtZero: true, grid: { color: line, drawTicks: false }, border: { display: false }, ticks: { color: fg2, padding: 8, font: { size: 11 }, maxTicksLimit: 5,
          callback: v => isMoney ? (v >= 1000 ? "R$ " + (v / 1000).toLocaleString("pt-BR") + " mil" : "R$ " + v) : v } } } } });
  AD.charts.push(c); return c;
}
function color_mix(hex, a) { const m = hex.replace("#", ""); if (m.length !== 6) return hex; const n = parseInt(m, 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; }
const barList = (rows, fmt = money) => { const max = Math.max(1, ...rows.map(r => r[1]));
  return rows.length ? `<div class="bar-list">${rows.map(([n, v, extra]) => `<div class="bar-row"><span class="nm" title="${esc(n)}">${esc(n)}</span><span class="track"><span class="fill" style="width:${(v / max * 100).toFixed(1)}%"></span></span><span class="num" style="font-weight:600">${fmt(v)}${extra ? `<span class="faint" style="font-weight:400"> · ${extra}</span>` : ""}</span></div>`).join("")}</div>`
    : `<p class="muted">Sem dados no período.</p>`; };
async function paySheet(o) {
  let method = o.payment_method === "fiado" ? "dinheiro" : o.payment_method, cust = null;
  const custs = await API.customers();
  const sh = openSheet(`<div class="sheet-head"><h2>Receber #${o.code}</h2><button class="btn icon ghost" data-close aria-label="Fechar">✕</button></div>
    <div class="num" style="font-size:2rem;font-weight:800;font-family:var(--f-display)">${money(o.total)}</div>
    <div class="grid2" id="ps-m"></div><div id="ps-extra"></div>
    <button class="btn primary block" id="ps-go">Confirmar recebimento</button>`);
  const el = sh.el;
  const draw = () => {
    $("#ps-m", el).innerHTML = ["dinheiro", "pix", "cartao_debito", "cartao_credito", "fiado"].map(m => `<button class="btn ${method === m ? "primary" : "ghost"}" data-m="${m}">${METHOD_LABEL[m]}</button>`).join("");
    $$("[data-m]", el).forEach(b => b.onclick = () => { method = b.dataset.m; draw(); });
    $("#ps-extra", el).innerHTML = method === "dinheiro" ? `<div class="field"><label for="ps-rec">Valor recebido</label><input class="input" id="ps-rec" inputmode="decimal" placeholder="${moneyInput(o.change_for || o.total)}"></div><div id="ps-troco" class="muted"></div>`
      : method === "fiado" ? customerPicker(custs, c => { cust = c; }, o.customer_id) : "";
    if (method === "fiado") bindPicker(el, custs, c => cust = c);
    const rec = $("#ps-rec", el); if (rec) rec.oninput = () => { const v = parseMoney(rec.value); $("#ps-troco", el).innerHTML = v >= o.total ? `Troco: <b class="num">${money(v - o.total)}</b>` : ""; };
  };
  draw();
  $("#ps-go", el).onclick = e => busy(e.currentTarget, async () => {
    if (method === "fiado" && !cust && !o.customer_id) { toast("Escolha o cliente do fiado.", true); return; }
    await API.payOrder(o.id, method, cust?.id); toast("Pagamento registrado"); sh.close(); renderView();
  });
}
function customerPicker(custs, _cb, preId) {

function bindPicker(el, custs, cb) {
  const q = $("#cp-q", el), res = $("#cp-res", el);
  q.oninput = () => { const t = q.value.toLowerCase().trim(), d = onlyDigits(t);
    const list = !t ? [] : custs.filter(c => c.name.toLowerCase().includes(t) || (d.length > 2 && (onlyDigits(c.phone).includes(d) || onlyDigits(c.cpf).includes(d)))).slice(0, 8);
    res.innerHTML = list.length ? `<div class="search-res">${list.map(c => `<button type="button" data-c="${c.id}"><span>${esc(c.name)}<br><span class="faint" style="font-size:.8rem">${esc(c.phone || "")}</span></span><span class="num ${c.balance > 0 ? "amt out" : "faint"}">${money(c.balance)}</span></button>`).join("")}</div>`

function shrinkImage(file, max) {
  return new Promise(res => { const im = new Image(); const url = URL.createObjectURL(file);
    im.onload = () => { const k = Math.min(1, max / Math.max(im.width, im.height)); if (k === 1 && file.size < 400e3) { res(file); return; }
      const c = document.createElement("canvas"); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k); c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
      c.toBlob(b => res(new File([b], file.name.replace(/\.\w+$/, "") + ".jpg", { type: "image/jpeg" })), "image/jpeg", .85); URL.revokeObjectURL(url); };
    im.onerror = () => res(file); im.src = url; });
}

  sino: ["Sino", (ctx, t, v) => { bell(ctx, 1046, t, 1.8, v * .6); bell(ctx, 1568, t, 1.2, v * .25); }],

let actx;
const audio = () => { try { actx ||= new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === "suspended") actx.resume(); return actx; } catch { return null; } };

function tone(ctx, f, t, d, v, type = "sine") { const o = ctx.createOscillator(), g = ctx.createGain(); o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + d); o.connect(g).connect(ctx.destination); o.start(t); o.stop(t + d + .05); }
function bell(ctx, f, t, d, v) { [1, 2.76, 5.4].forEach((m, i) => tone(ctx, f * m, t, d / (i + 1), v / (i * 2 + 1))); }
function noise(ctx, t, d, v, hp) { const b = ctx.createBuffer(1, ctx.sampleRate * d, ctx.sampleRate), data = b.getChannelData(0); for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
  const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain(); f.type = "highpass"; f.frequency.value = hp; s.buffer = b; g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  s.connect(f).connect(g).connect(ctx.destination); s.start(t); }

function printReceipt(o, { silentFail } = {}) {
  try {
    const f = document.createElement("iframe");
    f.setAttribute("aria-hidden", "true"); f.style.cssText = "position:fixed;right:0;bottom:0;width:0;height:0;border:0;visibility:hidden";
    document.body.appendChild(f);
    const d = f.contentWindow.document; d.open(); d.write(receiptHTML(o)); d.close();
    setTimeout(() => { try { f.contentWindow.focus(); f.contentWindow.print(); } catch (e) { if (!silentFail) previewReceipt(o, true); } setTimeout(() => f.remove(), 60000); }, 250);
    return true;
  } catch { if (!silentFail) previewReceipt(o, true); return false; }
}
function previewReceipt(o, failed) {
  const sh = openSheet(`<div class="sheet-head"><h2>Recibo do pedido ${o.code}</h2><button class="btn icon ghost" data-close aria-label="Fechar">✕</button></div>

    <div class="row" style="justify-content:flex-end"><button class="btn ghost" data-close>Fechar</button><button class="btn primary" id="rp-print">Imprimir</button></div>`);
  const f = $("#rp-f", sh.el); f.srcdoc = receiptHTML(o);
  $("#rp-print", sh.el).onclick = () => printReceipt(o, { silentFail: true });
}

/* ======================= ANIMAÇÃO DE APROXIMAÇÃO (efeito dock) ======================= */
/* Mesmo princípio da Floating Dock: cada item mede a distância do mouse ao próprio centro;
   até 150 px ele cresce, o mais perto cresce mais, e o tamanho segue uma mola (massa 0,1, rigidez 150, amortecimento 12). */
const MAG = { items: [], raf: 0, x: -1e4, y: -1e4, on: false };
function magSpring(it, target, dt) { const k = 150, c = 12, m = .1; const f = -k * (it.v - target) - c * it.vel; it.vel += f / m * dt; it.v += it.vel * dt; }
function magTick(t) {
  const dt = Math.min(.032, (t - (MAG.last || t)) / 1000) || .016; MAG.last = t; let moving = false;
  for (const it of MAG.items) {
    if (!it.el.isConnected) continue;
    const r = it.el.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    const d = it.axis === "y" ? Math.abs(MAG.y - cy) + (MAG.x < r.left - 40 || MAG.x > r.right + 40 ? 1e4 : 0) : Math.hypot(MAG.x - cx, MAG.y - cy);
    const p = Math.max(0, 1 - d / it.range), target = p * p * (3 - 2 * p);
    // passo fixo pequeno para a mola ficar estável
    for (let s = 0; s < 4; s++) magSpring(it, target, dt / 4);
    if (Math.abs(it.v - target) > .001 || Math.abs(it.vel) > .001) moving = true;
    it.apply(Math.max(0, it.v));
  }
  MAG.raf = moving || MAG.on ? requestAnimationFrame(magTick) : 0;
}
function magnify(root) {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches || !matchMedia("(hover: hover) and (pointer: fine)").matches) return;
  MAG.items = MAG.items.filter(i => i.el.isConnected);
  const add = (el, axis, range, apply) => { if (el._mag) return; el._mag = 1; MAG.items.push({ el, axis, range, apply, v: 0, vel: 0 }); };
  $$(".qa, .stat, .cx-act, .pc, .sale-cta, .sale-today, .method, .kpi", root).forEach(el => { el.classList.add("mag");
    add(el, "xy", 220, v => { el.style.transform = v > .002 ? `translateY(${(-v * 4).toFixed(2)}px) scale(${(1 + v * .035).toFixed(4)})` : ""; el.style.zIndex = v > .3 ? 2 : ""; }); });
  if (!MAG.bound) { MAG.bound = true;
    document.addEventListener("pointermove", e => { if (e.pointerType === "touch") return; MAG.x = e.clientX; MAG.y = e.clientY; MAG.on = true; if (!MAG.raf) MAG.raf = requestAnimationFrame(magTick); }, { passive: true });
    document.addEventListener("pointerleave", () => { MAG.x = MAG.y = -1e4; MAG.on = false; });
    document.documentElement.addEventListener("mouseleave", () => { MAG.x = MAG.y = -1e4; MAG.on = false; if (!MAG.raf) MAG.raf = requestAnimationFrame(magTick); });
  }
}

const firstName = n => { const w = String(n || "").trim().split(/\s+/); return /^(seu|sr\.?|dona|d\.|dr\.?|dra\.?)$/i.test(w[0]) && w[1] ? w[0] + " " + w[1] : w[0]; };
const fillMsg = (tpl, v) => String(tpl || "").replace(/\{(\w+)\}/g, (m, k) => v[k] ?? m);
const phoneKey = p => onlyDigits(p).slice(-9);
const appLink = () => location.href.split("#")[0];

/* junta clientes cadastrados e quem comprou pelo app (um contato por telefone) */
async function loadContacts() {
  const [custs, orders] = await Promise.all([API.customers(), API.orders({ from: new Date(Date.now() - 365 * 864e5) })]);
  const map = new Map();
  for (const c of custs) { const k = phoneKey(c.phone); if (k.length < 8) continue;
    map.set(k, { key: k, name: c.name, phone: c.phone, customer_id: c.id, balance: Number(c.balance) || 0, optin: !!c.whatsapp_optin, source: "Cliente cadastrado", last: c.last_movement }); }
  for (const o of orders) { const k = phoneKey(o.customer_phone); if (k.length < 8 || !validOrder(o)) continue;
    const cur = map.get(k);
    if (cur) { cur.optin = cur.optin || !!o.marketing_optin; if (!cur.last || o.created_at > cur.last) cur.last = o.created_at; cur.orders = (cur.orders || 0) + 1; }
    else map.set(k, { key: k, name: o.customer_name, phone: o.customer_phone, customer_id: null, balance: 0, optin: !!o.marketing_optin, source: "Comprou pelo app", last: o.created_at, orders: 1 }); }
  return [...map.values()].sort((a, b) => a.name.localeCompare(b.name));
}

function recipientPicker(list, { preselect, badge }) {
  const sel = new Set(list.filter(preselect).map(c => c.key));
  const wrap = h(`<div class="card tight rp"><div class="card-h"><h3>${ICON.users}Para quem</h3>
      <div class="tools"><label class="search-box">${ICON.search}<input placeholder="Buscar nome ou telefone" aria-label="Buscar contato"></label>
      <button class="btn sm ghost" data-all>Selecionar todos</button><button class="btn sm ghost" data-none>Limpar</button></div></div>
    <div class="rp-count"></div><div class="rp-list"></div></div>`);
  let q = "";
  const draw = () => { const t = q.toLowerCase(), d = onlyDigits(q);
    const vis = list.filter(c => !t || c.name.toLowerCase().includes(t) || (d.length > 2 && onlyDigits(c.phone).includes(d)));
    $(".rp-list", wrap).innerHTML = vis.length ? vis.map(c => `<label class="rp-row"><input type="checkbox" data-k="${c.key}" ${sel.has(c.key) ? "checked" : ""}>
      <span class="who"><i>${initials(c.name)}</i><span><b>${esc(c.name)}</b><span class="faint">${esc(c.phone)} · ${esc(c.source)}</span></span></span>${badge(c)}</label>`).join("")
      : `<p class="empty-row">Nenhum contato com telefone. Os clientes aparecem aqui quando compram pelo app ou quando você cadastra o telefone deles.</p>`;
    $(".rp-count", wrap).innerHTML = `<b class="num">${sel.size}</b> de ${list.length} selecionado${sel.size === 1 ? "" : "s"}`;
    $$("[data-k]", wrap).forEach(i => i.onchange = () => { i.checked ? sel.add(i.dataset.k) : sel.delete(i.dataset.k); $(".rp-count", wrap).innerHTML = `<b class="num">${sel.size}</b> de ${list.length} selecionado${sel.size === 1 ? "" : "s"}`; wrap.dispatchEvent(new Event("change")); }); };
  $("input", wrap).oninput = e => { q = e.target.value; draw(); };
  $("[data-all]", wrap).onclick = () => { list.forEach(c => sel.add(c.key)); draw(); wrap.dispatchEvent(new Event("change")); };
  $("[data-none]", wrap).onclick = () => { sel.clear(); draw(); wrap.dispatchEvent(new Event("change")); };
  draw();
  wrap.selected = () => list.filter(c => sel.has(c.key));
  return wrap;
}

  body.innerHTML = `<div class="mg-grid"><div class="card"><div class="card-h"><h3>${ICON.receipt}Cobrança</h3><span class="pay pendente num">${money(sumBy(debtors, c => c.balance))} em aberto</span></div>
      <p class="muted" style="font-size:.9rem">Só aparecem os clientes com fiado em aberto. Cada um recebe a mensagem com o próprio saldo.</p>
      <div class="field"><label>Prévia</label><div class="wa-bubble" id="db-prev"></div></div>
      <p class="faint" style="font-size:.82rem">Edite o texto em Configurações › WhatsApp. Use {nome}, {valor}, {pix} e {loja}.</p></div>
    <div id="db-rp"></div></div>
    <div class="mg-send"><span id="db-sum" class="muted"></span><button class="btn primary big-btn" id="db-go">${ICON.wa}Enviar cobranças</button></div>`;
  const rp = recipientPicker(debtors, { preselect: () => true, badge: c => `<span class="pay pendente num">${money(c.balance)}</span>` });
  $("#db-rp", body).appendChild(rp);
  const prev = () => { const first = rp.selected()[0] || debtors[0] || { name: "Maria", balance: 25 };
    $("#db-prev", body).innerHTML = `<span>${esc(build(first)).replace(/\n/g, "<br>")}</span>`;
    const l = rp.selected(); $("#db-sum", body).textContent = `${l.length} cliente${l.length === 1 ? "" : "s"} · ${money(sumBy(l, c => c.balance))}`; };
  rp.addEventListener("change", prev); prev();
  $("#db-go", body).onclick = e => busy(e.currentTarget, async () => {
    const list = rp.selected(); if (!list.length) { toast("Escolha pelo menos um cliente.", true); return; }
    if (s.wa_mode === "api") return sendApi(list, { kind: "cobranca", template: s.wa_debt_template, params: c => [firstName(c.name), money(c.balance), s.pix_key || ""] });
    sendManual(list.map(c => ({ ...c, text: build(c) })), { kind: "cobranca" });
  });
}

/* envio automático pela API oficial */
async function sendApi(list, { kind, template, image_url, params }) {
  if (!template) throw new Error("MODELO_OBRIGATORIO");
  const r = await API.waSend({ kind, template, image_url, recipients: list.map(c => ({ phone: c.phone, name: c.name, params: params(c) })) });
  openSheet(`<div class="sheet-head"><h2>Envio concluído</h2><button class="btn icon ghost" data-close aria-label="Fechar">✕</button></div>
    <div class="mini-stats"><div><span>Enviadas</span><b class="num" style="color:var(--good)">${r.sent}</b></div><div><span>Com erro</span><b class="num" style="color:${r.failed ? "var(--bad)" : "inherit"}">${r.failed}</b></div></div>
    ${r.failed ? `<div class="tl">${r.results.filter(x => !x.ok).map(x => `<div class="tl-i"><span class="h">${esc(x.phone)}</span><span class="faint">${esc(x.error || "")}</span><span></span></div>`).join("")}</div>` : ""}`);
}

/* envio pelo WhatsApp do dono: um por um, com o texto pronto */
function sendManual(list, { kind, imageFile, imageUrl }) {
  let i = 0; const sent = [];
  const canShare = imageFile && navigator.canShare?.({ files: [imageFile] });
  const sh = openSheet(`<div class="sheet-head"><div><h2>Enviando pelo WhatsApp</h2><p class="faint" id="sm-step" style="margin-top:2px"></p></div><button class="btn icon ghost" data-close aria-label="Fechar">✕</button></div>
    <div class="wa-prog"><i id="wa-bar"></i></div><div id="wa-cur"></div>`, { onClose: () => { if (sent.length) { API.logMessages(sent).catch(() => {}); toast(`${sent.length} mensage${sent.length === 1 ? "m" : "ns"} enviada${sent.length === 1 ? "" : "s"}`); if (AD.view === "mensagens") renderView(); } } });
  const draw = () => {
    $("#wa-bar", sh.el).style.width = (i / list.length * 100) + "%";
    if (i >= list.length) { $("#sm-step", sh.el).textContent = "Pronto";
      $("#wa-cur", sh.el).innerHTML = `<div class="inc-done">${ICON.checkBig}<h3>${sent.length} de ${list.length} enviadas</h3><button class="btn primary" data-close>Concluir</button></div>`;
      $$("[data-close]", sh.el).forEach(b => b.onclick = () => sh.close()); return; }
    const c = list[i];
    $("#sm-step", sh.el).textContent = `${i + 1} de ${list.length}`;
    $("#wa-cur", sh.el).innerHTML = `<div class="inc-cust"><div class="who"><i>${initials(c.name)}</i><div><b>${esc(c.name)}</b><span class="faint" style="font-size:.86rem">${esc(c.phone)}</span></div></div>${c.balance > 0 && kind === "cobranca" ? `<span class="pay pendente num">${money(c.balance)}</span>` : ""}</div>
      <div class="wa-bubble">${imageUrl ? `<img src="${esc(imageUrl)}" alt="">` : ""}<span>${esc(c.text).replace(/\n/g, "<br>")}</span></div>
      ${imageUrl ? `<p class="faint" style="font-size:.84rem">${canShare ? "Toque em Mandar com imagem para escolher a conversa no WhatsApp." : "O link do WhatsApp leva só o texto. Para mandar a foto, anexe no próprio WhatsApp ou envie pelo celular, que tem a opção de compartilhar a imagem."}</p>` : ""}
      <div class="inc-act"><button class="btn ghost" id="wa-skip">Pular</button>
        <a class="btn primary big-btn" id="wa-open" href="${waLink(c.phone, c.text)}" target="_blank" rel="noopener">${ICON.wa}Abrir no WhatsApp</a></div>
      ${canShare ? `<button class="btn ghost block" id="wa-share">Mandar com imagem (compartilhar)</button>` : ""}`;
    const next = ok => { if (ok) sent.push({ kind, channel: "manual", phone: c.phone, name: c.name, body: c.text }); i++; draw(); };
    $("#wa-open", sh.el).onclick = () => setTimeout(() => next(true), 300);
    $("#wa-skip", sh.el).onclick = () => next(false);
    $("#wa-share", sh.el) && ($("#wa-share", sh.el).onclick = async () => { try { await copyText(c.text); await navigator.share({ files: [imageFile], text: c.text }); next(true); } catch {} });
  };
  draw();
}

async function drawHistory(body) {
  const log = await API.messageLog();
  const K = { promo: "Promoção", cobranca: "Cobrança", story: "Story" };
  body.innerHTML = `<div class="card tight"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Quando</th><th>Tipo</th><th>Contato</th><th class="hide-sm">Mensagem</th><th>Como</th></tr></thead><tbody>
    ${log.length ? log.map(m => `<tr><td class="faint num">${fmtDT(m.created_at)}</td><td>${K[m.kind]}</td><td><b>${esc(m.name || "")}</b><div class="sub">${esc(m.phone)}</div></td><td class="hide-sm clip">${esc(m.body || "")}</td>
      <td>${m.status === "erro" ? `<span class="pay pendente" title="${esc(m.error || "")}">Erro</span>` : `<span class="pay pago">${m.channel === "api" ? "Automático" : "Pelo WhatsApp"}</span>`}</td></tr>`).join("")
      : `<tr><td colspan="5" class="empty-row">Nenhuma mensagem enviada ainda.</td></tr>`}</tbody></table></div></div>`;
}

/* ================= roteamento ================= */
async function route() {
  const isAdmin = location.hash.startsWith("#admin");
  if (isAdmin) await startAdmin(); else await startClient();
}
(async function boot() {
  await initApi();
  if (API.mode === "demo") {
    const bar = $("#demo-bar"); bar.hidden = false;
    const small = matchMedia("(max-width:600px)").matches;
    bar.innerHTML = `<span>${small ? "Apresentação · dados de exemplo" : "Versão de apresentação com dados de exemplo"}</span>
      <span class="demo-sw"><a href="#" data-sw="c">Cliente</a><a href="#admin" data-sw="a">Dono</a></span>`;
    const mark = () => $$("[data-sw]", bar).forEach(x => x.setAttribute("aria-current", (x.dataset.sw === "a") === location.hash.startsWith("#admin") ? "page" : "false"));
    mark(); window.addEventListener("hashchange", mark);
    $('[data-sw="a"]', bar).onclick = async e => { e.preventDefault(); if (!(await API.getUser())) await API.signIn(); location.hash = "#admin"; };
  }
  let last = location.hash.startsWith("#admin");
  window.addEventListener("hashchange", () => { const now = location.hash.startsWith("#admin"); if (now !== last) { last = now; route(); } });
  route();
})();

</script>
